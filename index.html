<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montagem de Painéis — Obra Amaggi</title>
<meta name="description" content="Acompanhamento da montagem LSF da obra Amaggi: 3D dos painéis PV1, treliças PV2 e tesouras, status de cada um e prancha de montagem.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/campo3d.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#eef2f6;--panel:#ffffff;--panel-2:#f5f7fa;--text:#0d1b2a;--text-dim:#52657a;
    --border:#cdd8e3;--accent:#c9700f;--accent-ink:#fff7ec;--viewport:#f4f6f8;
    --overlay:rgba(19,28,40,0.88);--overlay-ink:#dfe9f5;--overlay-dim:#8ea0b5;
    --s0:#b8c1cc;--s1:#93c6ee;--s2:#4b8fdb;--s3:#2257a8;--s4:#22a05a;--s5:#e04646;
    --shadow:0 10px 30px -10px rgba(13,27,42,0.28);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;}
  button,input,textarea{font-family:inherit;font-size:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---- Topo ---- */
  .topbar{flex:none;display:flex;align-items:center;gap:10px 14px;padding:10px 16px 10px;padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--panel);border-bottom:1px solid var(--border);z-index:20;}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
  .brand .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:11px;letter-spacing:.07em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
  .brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:6px 11px;flex:none;cursor:pointer;color:inherit;}
  .prog:hover{border-color:var(--accent);}
  .prog-track{width:84px;height:7px;border-radius:4px;background:#e2e8ef;overflow:hidden;display:flex;}
  .prog-track i{display:block;height:100%;}
  .prog-text{font-size:10.5px;line-height:1.3;color:var(--text-dim);white-space:nowrap;text-align:left;}
  .prog-text b{color:var(--text);font-weight:700;font-size:12.5px;}
  .who{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel-2);border-radius:999px;padding:6px 11px 6px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);flex:none;max-width:170px;}
  .who span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s0);}
  .dot.on{background:var(--s4);} .dot.wait{background:#f0a020;} .dot.off{background:var(--s5);}
  .busca{display:flex;align-items:center;gap:6px;flex:0 1 230px;min-width:0;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:0 4px 0 10px;}
  .busca:focus-within{border-color:var(--accent);}
  .busca svg{width:16px;height:16px;stroke:var(--text-dim);fill:none;stroke-width:2;flex:none;}
  .busca input{border:none;background:transparent;flex:1;min-width:0;padding:9px 0;outline:none;font-size:16px;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;}
  .busca input::placeholder{text-transform:none;font-family:"Public Sans",sans-serif;font-size:13px;}
  .busca button{border:none;background:var(--text);color:#fff;border-radius:7px;padding:6px 10px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none;}
  @media (max-width:560px){ .topbar{flex-wrap:wrap;padding-bottom:8px;} .busca{order:2;flex:1 1 100%;} .prog{order:3;width:100%;} .prog-track{flex:1;width:auto;} .who{max-width:140px;} .brand h1{font-size:15px;} .legend{min-width:0;} }

  /* ---- Palco 3D ---- */
  .stage{position:relative;flex:1;min-height:0;background:var(--viewport);overflow:hidden;}
  #view{position:absolute;inset:0;}
  #view canvas{display:block;width:100%;height:100%;touch-action:none;}
  #labels{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;line-height:1;padding:3px 5px 3px;border-radius:5px;background:rgba(255,255,255,.92);color:#0d1b2a;
    border:1px solid rgba(13,27,42,.18);border-left:3px solid var(--c,#b8c1cc);white-space:nowrap;pointer-events:auto;cursor:pointer;user-select:none;}
  .tag.sel{background:#ff7a00;color:#fff;border-color:#c25400;font-size:12px;padding:4px 7px;z-index:2;}
  .tag.dim{opacity:.18;pointer-events:none;}

  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(244,246,248,.94);z-index:30;transition:opacity .3s;}
  #loading .lbl{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;text-align:center;padding:0 16px;}
  #loading .pct{font-family:"Archivo",sans-serif;font-weight:800;font-size:32px;}
  .bar{width:200px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s;}
  #loading.hide{opacity:0;pointer-events:none;}
  #load-err{color:#c0392b;font-size:12.5px;max-width:300px;text-align:center;line-height:1.5;}

  /* legenda / filtro */
  .legend{position:absolute;right:12px;top:12px;z-index:15;display:flex;flex-direction:column;gap:4px;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px;min-width:150px;}
  .legend .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--overlay-dim);padding:2px 6px 3px;background:none;border:none;cursor:pointer;width:100%;}
  .legend.min .chip{display:none;}
  .legend.min #lg-dia{display:flex;}  /* filtro por dia sempre à vista, para dar para limpar */
  .chip{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 7px;font-size:12px;font-weight:600;color:var(--overlay-ink);cursor:pointer;text-align:left;}
  .chip .sw{width:10px;height:10px;border-radius:3px;flex:none;}
  .chip .n{margin-left:auto;padding-left:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--overlay-dim);}
  .chip.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .legend.filtering .chip:not(.on){opacity:.5;}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:1px 1px 4px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:2px;}
  .seg button{border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--overlay-ink);border-radius:7px;padding:6px 6px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .seg button:first-child{grid-column:1/-1;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .toolbar{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:5px;z-index:15;}
  .ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--overlay-ink);cursor:pointer;}
  .ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ib.on{background:var(--accent);color:var(--accent-ink);}
  .toolbar hr{width:100%;border:none;border-top:1px solid rgba(255,255,255,.12);margin:1px 0;}

  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0d1b2a;color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;z-index:40;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}

  /* ---- Folha do painel ---- */
  #sheet{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 24px));
    background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);z-index:25;padding:14px 14px 12px;display:flex;flex-direction:column;gap:11px;max-height:calc(100% - 24px);overflow:auto;}
  .sh-head{display:flex;align-items:flex-start;gap:10px;}
  .sh-head h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:22px;margin:0;line-height:1.1;letter-spacing:-.01em;}
  .sh-head .sub{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .sh-head .sp{flex:1;}
  .x{border:none;background:var(--panel-2);width:32px;height:32px;border-radius:8px;color:var(--text-dim);font-size:18px;cursor:pointer;flex:none;}
  .nav{display:flex;gap:4px;flex:none;}
  .nav button{border:1px solid var(--border);background:var(--panel-2);height:32px;min-width:32px;border-radius:8px;cursor:pointer;color:var(--text);font-size:15px;}
  .cur{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .cur .sw{width:12px;height:12px;border-radius:4px;flex:none;}
  .cur b{font-size:14px;}
  .cur .meta{margin-left:auto;font-size:11px;color:var(--text-dim);text-align:right;}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .step{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 4px 8px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--text);min-height:58px;justify-content:center;text-align:center;line-height:1.15;}
  .step .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .step.done .ck{background:var(--c);border-color:var(--c);}
  .step.now{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);}
  .row2{display:flex;gap:6px;}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:10px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--text);text-decoration:none;}
  .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .btn.primary{background:var(--text);border-color:var(--text);color:#fff;}
  .btn.bad{color:#b62f2f;border-color:#f0c4c4;background:#fff5f5;}
  .btn.bad.on{background:var(--s5);border-color:var(--s5);color:#fff;}
  .btn.ghost{flex:none;background:none;border-color:transparent;color:var(--text-dim);font-weight:600;font-size:12px;padding:8px 6px;}
  .prob{display:flex;flex-direction:column;gap:6px;}
  .prob textarea{width:100%;min-height:62px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;resize:vertical;font-size:14px;}
  .fotos{display:flex;gap:6px;flex-wrap:wrap;}
  .ft{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2);padding:0;cursor:pointer;flex:none;}
  .ft img{width:100%;height:100%;object-fit:cover;display:block;}
  .ft .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:20px;text-align:center;border:none;cursor:pointer;padding:0;}
  .ft.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#b62f2f;border:1.5px dashed #e8a9a9;background:#fff5f5;}
  .ft.add svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ft.add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
  .ft.falta img{display:none;}
  .ft.falta::after{content:"foto a caminho";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--text-dim);padding:4px;}
  .note .fotos{margin-top:7px;}
  .note{font-size:12.5px;background:#fff5f5;border:1px solid #f0c4c4;color:#7d1f1f;border-radius:10px;padding:8px 10px;}
  .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--text-dim);}
  .facts b{color:var(--text);font-weight:600;}

  /* ---- Lista ---- */
  #list{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--border);z-index:28;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .lh2{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;}
  .lh2 h3{font-family:"Archivo",sans-serif;font-size:16px;margin:0;flex:1;}
  .search{margin:0 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:var(--panel-2);}
  .search svg{width:16px;height:16px;stroke:var(--text-dim);fill:none;stroke-width:2;}
  .search input{border:none;background:transparent;flex:1;padding:10px 0;outline:none;font-size:15px;}
  .groups{display:flex;gap:5px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none;}
  .groups button{flex:none;border:1px solid var(--border);background:var(--panel-2);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
  .groups button small{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;color:var(--text-dim);}
  .groups button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .groups button.on small{color:var(--accent-ink);opacity:.85;}
  .items{flex:1;overflow:auto;padding:4px 6px 10px;}
  .it{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:9px 8px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text);}
  .it:hover{background:var(--panel-2);}
  .it.sel{background:#fdf1e3;}
  .it .sw{width:11px;height:11px;border-radius:3px;flex:none;}
  .it .cd{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13.5px;width:64px;flex:none;}
  .it .st{font-size:12.5px;flex:1;min-width:0;}
  .it .st small{display:block;font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .it .no3d{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-dim);border:1px dashed var(--border);border-radius:5px;padding:2px 5px;flex:none;}
  .lfoot{border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--text-dim);}
  .dias{padding:2px 12px 6px;}
  .dias .dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:0 2px 5px;}
  .dias .dh b{color:var(--text);letter-spacing:0;}
  .dias .groups{padding:0 0 4px;}
  .empty{padding:20px;text-align:center;color:var(--text-dim);font-size:13px;}

  /* ---- Diálogo do nome ---- */
  #namedlg{position:fixed;inset:0;background:rgba(13,27,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
  #namedlg form{background:var(--panel);border-radius:16px;padding:18px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);}
  #namedlg h3{margin:0;font-family:"Archivo",sans-serif;font-size:17px;}
  #namedlg p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.45;}
  #namedlg input{border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:16px;}
  /* ---- Visualizador de prancha ---- */
  #pdfv{position:fixed;inset:0;z-index:55;background:#3a4452;display:flex;flex-direction:column;}
  .pv-top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--border);}
  .pv-back{display:flex;align-items:center;gap:6px;border:none;background:var(--text);color:#fff;border-radius:10px;padding:10px 14px 10px 10px;font-weight:700;font-size:14px;cursor:pointer;flex:none;}
  .pv-back svg,.pv-ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pv-title{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pv-ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;color:var(--text);cursor:pointer;text-decoration:none;font-size:18px;font-weight:700;}
  .pv-body{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;}
  .pv-pages{width:max-content;min-width:100%;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;transform-origin:0 0;}
  .pv-pages img{display:block;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:none;user-select:none;-webkit-user-drag:none;}
  .pv-pages canvas{display:block;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);}
  .pv-msg{color:#fff;text-align:center;padding:40px 20px;font-size:14px;line-height:1.5;}
  .pv-msg a{color:#ffd6a3;font-weight:700;}
  @media (max-width:420px){ .pv-back span{display:none;} .pv-back{padding:10px;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">Obra Amaggi · LSF</span><h1>Montagem de painéis</h1></div>
    <form class="busca" id="busca" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="busca-in" type="search" list="busca-codes" placeholder="Digite a peça: 38, PV2-07, TS01-5…" autocomplete="off" enterkeyhint="search" aria-label="Número do painel">
      <button type="submit">Ir</button>
      <datalist id="busca-codes"></datalist>
    </form>
    <button class="prog" id="prog" title="Abrir a lista de peças">
      <span class="prog-track" id="prog-track"></span>
      <span class="prog-text mono" id="prog-text"><b>0</b>/0 conferidas</span>
    </button>
    <button class="who" id="who" title="Seu nome e sincronização"><span class="dot" id="sync-dot"></span><span class="n" id="who-name">Identificar</span></button>
  </header>

  <main class="stage">
    <div id="view"></div>
    <div id="labels"></div>

    <div class="toolbar" role="toolbar" aria-label="Ferramentas">
      <button class="ib" id="b-list" title="Lista de peças"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <hr>
      <button class="ib" id="b-fit" title="Enquadrar tudo"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" id="b-top" title="Ver em planta"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h9v8M13 4v4"/></svg></button>
      <button class="ib" id="b-tags" title="Números dos painéis"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 4l-2 16M16 4l-2 16"/></svg></button>

/* ================= Fotos do problema =================
   A foto é reduzida no celular (lado maior 1600 px, JPEG ~200–300 KB) e guardada no aparelho

const MAX_FOTOS = 4;

  return fotoDb ||= new Promise((ok, erro) => {
    const r = indexedDB.open('campo3d-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath: 'id' });

  const db = await abrirFotoDb();

    tx.oncomplete = () => ok(res); tx.onerror = () => erro(tx.error); tx.onabort = () => erro(tx.error);
  });
}
async function carregarFotosLocais(){

    const todas = await fotoTx('readonly', (st) => st.getAll());

  } catch {}

const fotoUrl = (id) => fotoLocal.get(id) || `/api/fotos?id=${encodeURIComponent(id)}`;
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
async function prepararFoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.72));

let prob = { code: null, texto: '', fotos: [], lendo: 0 };

let anim = null;
function voar(pos, tgt, ms = 450){

  const p0 = camera.position.clone(), t0 = controls.target.clone(), s = performance.now();
  anim = (now) => {
    let k = Math.min(1, (now - s) / ms); k = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(p0, pos, k); controls.target.lerpVectors(t0, tgt, k);
    if (k >= 1) anim = null;
  };
}
function enquadrar(planta = false, instant = false){

  const r = Math.max(sz.x, sz.z) * 0.5 + 1;
  const d = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 0.8 / camera.aspect : 1.0);
  const pos = planta ? new THREE.Vector3(c.x, c.y + d, c.z + 0.01) : new THREE.Vector3(c.x + d * 0.55, c.y + d * 0.62, c.z + d * 0.62);
  camera.near = Math.max(0.05, d / 500); camera.far = d * 20; camera.updateProjectionMatrix();

}
function focar(code){

  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y > 0.9) dir.set(0.5, 0.7, 0.5).normalize();
  const d = r * (camera.aspect < 1 ? 2.6 : 1.8);
  voar(p.center.clone().add(dir.multiplyScalar(d)), p.center.clone());
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; anim = null; });
renderer.domElement.addEventListener('pointerup', (e) => {

/* Rótulos: mostra os mais próximos da câmera e esconde os que cairiam em cima de outro. */
let lastDeclutter = 0; const _v = new THREE.Vector3();
function declutter(){
  const w = view.clientWidth, h = view.clientHeight, placed = [];
  const lista = [...paineis.values()].map((p) => ({ p, d: camera.position.distanceToSquared(p.tag.position) }))
    .sort((a, b) => (b.p.code === sel) - (a.p.code === sel) || a.d - b.d);
  for (const { p } of lista) {
    if (!tagsOn || (modoCamada(p.grupo) !== 'on' && p.code !== sel)) { p.tag.visible = false; continue; }
    _v.copy(p.tag.position).project(camera);
    if (_v.z > 1 || Math.abs(_v.x) > 1.1 || Math.abs(_v.y) > 1.1) { p.tag.visible = false; continue; }
    const x = (_v.x + 1) / 2 * w, y = (1 - _v.y) / 2 * h, bw = 7 * p.el.textContent.length + 14, bh = 18;
    const hit = p.code !== sel && placed.some((r) => Math.abs(r.x - x) < (bw + r.bw) / 2 && Math.abs(r.y - y) < bh);
    p.tag.visible = !hit; if (!hit) placed.push({ x, y, bw });
  }
}

  $('prob-ok') && ($('prob-ok').onclick = () => confirmarProblema(code));
  $('prob-t') && ($('prob-t').oninput = (ev) => { prob.texto = ev.target.value; });
  $('prob-f') && ($('prob-f').onchange = (ev) => { anexarFotos(ev.target.files); ev.target.value = ''; });
  sh.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { prob.fotos.splice(+b.dataset.rm, 1); renderSheet(); });
  sh.querySelectorAll('[data-ver]').forEach((im) => im.onclick = () => abrirImagem(prob.fotos[+im.dataset.ver].url, `${code} · foto ${+im.dataset.ver + 1}`));
  sh.querySelectorAll('[data-foto]').forEach((b) => b.onclick = () => abrirImagem(fotoUrl(b.dataset.foto), `${code} · foto ${b.dataset.n} do problema`));
  $('sh-zero') && ($('sh-zero').onclick = () => { probAberto = false; marcar(code, 0); });
}
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* --- lista --- */
let grupoAtivo = camada === 'tudo' ? 'PV1' : camadaDe(camada);
const tem3D = (g) => !!GRUPOS.find((x) => x.id === g)?.tres;
function renderLista(){
  if ($('list').hidden) return;
  const q = $('q').value.trim().toUpperCase();
  $('groups').innerHTML = ABAS.map((g) => {
    const l = PECAS.filter((p) => naAba(p, g.id)), c = contagem(l);
    return `<button class="${grupoAtivo === g.id && !q ? 'on' : ''}" data-g="${g.id}">${g.nome}<small>${g.sub ? g.sub + ' · ' : ''}${c[4]}/${l.length} ok${c[5] ? ' · ' + c[5] + ' prob.' : ''}</small></button>`;
  }).join('');
  $('groups').querySelectorAll('button').forEach((b) => b.onclick = () => { grupoAtivo = b.dataset.g; $('q').value = ''; renderLista(); });
  let lista;
  if (q) {
    const nq = normCode(q), num = /^\d+$/.test(q) ? +q : null;
    lista = PECAS.filter((p) => p.code === nq || p.code.replace('-', '').includes(q.replace(/[\s-]/g, '')) || (num != null && p.num === num && naAba(p, grupoAtivo)));
  } else lista = PECAS.filter((p) => naAba(p, grupoAtivo));
  lista = lista.filter((p) => passa(p.code));
  renderDias(!q);
  // problemas primeiro, depois a ordem do número
  lista = lista.slice().sort((a, b) => (etapa(b.code) === 5) - (etapa(a.code) === 5) || PECAS.indexOf(a) - PECAS.indexOf(b));
  $('items').innerHTML = lista.length ? lista.map((p) => {
    const s = estado(p.code), e = s?.etapa ?? 0;
    const pk = kg(p.code) != null ? `${fmtKg(kg(p.code))} kg` : '';
    const sub = [pk, s?.autor ? `${esc(s.autor)} · ${quando(s.em, s.planilha)}${s.pend ? ' · na fila' : ''}${e === 5 && s.nota ? ' · ' + esc(s.nota) : ''}${e === 5 && s.fotos?.length ? ` · ${s.fotos.length} foto${s.fotos.length > 1 ? 's' : ''}` : ''}` : ''].filter(Boolean).join(' · ');
    return `<button class="it ${sel === p.code ? 'sel' : ''}" data-c="${p.code}"><span class="sw" style="background:${ST[e].c}"></span><span class="cd">${p.code}</span><span class="st">${ST[e].n}${sub ? `<small>${sub}</small>` : ''}</span>${tem3D(p.grupo) ? (!paineis.has(p.code) && paineis.size ? '<span class="no3d">fora do 3D</span>' : '') : '<span class="no3d">sem 3D</span>'}</button>`;
  }).join('') : `<div class="empty">Nenhuma peça ${filtro != null ? 'com status “' + ST[filtro].n + '”' : filtroDia ? 'montada em ' + fmtDia(filtroDia) : 'encontrada'}.</div>`;
  $('items').querySelectorAll('.it').forEach((b) => b.onclick = () => {
    const c = b.dataset.c; probAberto = false;
    if (window.innerWidth < 760) $('list').hidden = true;
    selecionar(c, true);
  });
}
// Montagem por dia (peças da aba aberta, pela data da planilha): quantidade e kg; tocar no dia acende só essas peças no 3D.
function renderDias(mostrar){
  const box = $('dias'); box.hidden = !mostrar; if (!mostrar) return;
  const dias = {};
  PECAS.filter((p) => naAba(p, grupoAtivo)).forEach((p) => {
    const d = montadoEm(p.code); if (!d) return;
    (dias[d] ||= { n: 0, kg: 0 }); dias[d].n++; dias[d].kg += kg(p.code) || 0;
  });
  const lista = Object.keys(dias).sort().reverse();
  if (!lista.length) { box.hidden = true; return; }
  const tn = lista.reduce((a, d) => a + dias[d].n, 0), tk = lista.reduce((a, d) => a + dias[d].kg, 0);
  box.innerHTML = `<div class="dh"><span>Montagem por dia</span><span><b>${tn}</b> peças · <b>${fmtKg(Math.round(tk))}</b> kg</span></div>
    <div class="groups">${lista.map((d) => `<button class="${filtroDia === d ? 'on' : ''}" data-d="${d}">${fmtDia(d, true)}<small>${dias[d].n} · ${fmtKg(Math.round(dias[d].kg))} kg</small></button>`).join('')}</div>`;
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    filtroDia = filtroDia === b.dataset.d ? null : b.dataset.d;
    if (filtroDia) toast(`${dias[filtroDia].n} peças montadas em ${fmtDia(filtroDia)} · ${fmtKg(dias[filtroDia].kg)} kg`);
    refresh();
  });
}
function abrirLista(){ $('list').hidden = false; $('b-list').classList.add('on'); renderLista(); }
function fecharLista(){ $('list').hidden = true; $('b-list').classList.remove('on'); }
$('b-list').onclick = () => ($('list').hidden ? abrirLista() : fecharLista());

$('list-x').onclick = fecharLista;
$('q').addEventListener('input', renderLista);
$('b-fit').onclick = () => { $('b-top').classList.remove('on'); enquadrar(false); };
$('b-top').onclick = () => { const on = !$('b-top').classList.contains('on'); $('b-top').classList.toggle('on', on); enquadrar(on); };
$('b-tags').onclick = () => { tagsOn = !tagsOn; ls.set(LS.tags, tagsOn); aplicarVis(); };
$('b-ctx').onclick = () => { ctxOn = !ctxOn; ls.set(LS.ctx, ctxOn); aplicarVis(); };

/* --- busca rápida no topo: digita o painel e vai direto para ele --- */
$('busca-codes').innerHTML = PECAS.map((p) => `<option value="${p.code}">`).join('');
$('busca').onsubmit = (ev) => {
  ev.preventDefault();
  const inp = $('busca-in'), q = inp.value.trim().toUpperCase(); if (!q) return;
  let code = normCode(q);
  if (!code && /^\d+$/.test(q)) code = `PV1-${pad(+q)}`; // só o número: painel do PV1
  if (code && PECA[code]) {
    inp.value = ''; inp.blur(); probAberto = false;
    if (window.innerWidth < 760) fecharLista();
    selecionar(code, true);
    if (!paineis.has(code)) toast(`${code} não tem 3D — use a prancha`);
  } else {
    // vários resultados ou nada exato: mostra a lista filtrada
    $('q').value = q; abrirLista(); inp.blur();
  }
};

/* --- pranchas offline --- */
$('b-offline').onclick = async () => {
  const b = $('b-offline'), sp = b.querySelector('span'); b.disabled = true;
  let ok = 0, falha = 0;
  const urls = [...new Set(PECAS.map((p) => p.pdf))]; // as 24 tesouras usam só 3 pranchas
  for (let i = 0; i < urls.length; i += 6) {
    await Promise.all(urls.slice(i, i + 6).map((u) => fetch(u).then((r) => (r.ok ? ok++ : falha++)).catch(() => falha++)));
    sp.textContent = `Baixando pranchas… ${ok + falha}/${urls.length}`;
  }
  sp.textContent = falha ? `${ok} pranchas salvas, ${falha} falharam — tente de novo com internet` : `${ok} pranchas salvas neste aparelho`;
  b.disabled = false;
  fetch(PLANTA).catch(() => {});
  pdfLib().catch(() => {}); // guarda também o leitor de PDF para abrir sem internet
};

/* --- visualizador de prancha (dentro do app, com "Voltar ao 3D") --- */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/';
let pdfjsMod = null;
async function pdfLib(){
  if (!pdfjsMod) {
    const m = await import(PDFJS + 'build/pdf.min.mjs');
    m.GlobalWorkerOptions.workerSrc = PDFJS + 'build/pdf.worker.min.mjs';
    pdfjsMod = m;
  }
  return pdfjsMod;
}
const pv = { code: null, doc: null, zoom: 1, token: 0, hist: false, ws: [] };
async function abrirPrancha(code){
  const url = prancha(code);
  pv.code = code; pv.zoom = 1; pv.doc = null; const tk = ++pv.token;
  $('pv-title').textContent = PECA[code]?.tipo ? `${code} · prancha ${PECA[code].tipo}` : code;
  $('pv-ext').href = url;
  $('pv-pages').innerHTML = '<div class="pv-msg">Abrindo prancha…</div>';
  $('pdfv').hidden = false;
  if (!pv.hist) { history.pushState({ prancha: code }, ''); pv.hist = true; } // botão voltar do celular fecha a prancha
  try {
    const lib = await pdfLib();
    const doc = await lib.getDocument({ url, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' }).promise;
    if (tk !== pv.token) return;
    pv.doc = doc; pv.ws = [];
    for (let i = 1; i <= doc.numPages; i++) pv.ws.push((await doc.getPage(i)).getViewport({ scale: 1 }));
    $('pv-pages').innerHTML = '';
    for (let i = 0; i < doc.numPages; i++) $('pv-pages').appendChild(document.createElement('canvas'));
    $('pv-body').scrollTo(0, 0);
    desenharPrancha();
  } catch (err) {
    if (tk !== pv.token) return;
    $('pv-pages').innerHTML = `<div class="pv-msg">Não foi possível mostrar a prancha aqui${navigator.onLine ? '' : ' (sem internet e ela ainda não foi baixada neste aparelho)'}.<br><br><a href="${url}" target="_blank" rel="noopener">Abrir no leitor de PDF</a></div>`;
  }
}
// planta baixa do escritório: mesma tela, com zoom e "Voltar ao 3D"
const PLANTA = 'planta/pb-amaggi.jpg';
function abrirImagem(url, titulo){
  pv.code = null; pv.zoom = 1; pv.doc?.destroy(); pv.doc = null; pv.ws = []; const tk = ++pv.token;
  $('pv-title').textContent = titulo; $('pv-ext').href = url;
  $('pv-pages').innerHTML = '<div class="pv-msg">Abrindo…</div>';
  $('pdfv').hidden = false;
  if (!pv.hist) { history.pushState({ prancha: titulo }, ''); pv.hist = true; }
  const img = new Image(); img.alt = titulo; img.draggable = false;
  img.onload = () => {
    if (tk !== pv.token) return;
    pv.ws = [{ width: img.naturalWidth, height: img.naturalHeight }];
    $('pv-pages').innerHTML = ''; $('pv-pages').appendChild(img);
    $('pv-body').scrollTo(0, 0); tamanhoCss();
  };
  img.onerror = () => { if (tk === pv.token) $('pv-pages').innerHTML = '<div class="pv-msg">Não foi possível abrir a planta. Verifique a internet.</div>'; };
  img.src = url;
}
$('b-planta').onclick = () => abrirImagem(PLANTA, 'Planta baixa');
function fecharPrancha(viaHist){
  if ($('pdfv').hidden) return;
  pv.ws = [];
  pv.token++; $('pdfv').hidden = true; $('pv-pages').innerHTML = ''; pv.doc?.destroy(); pv.doc = null;
  if (pv.hist) { pv.hist = false; if (!viaHist) history.back(); }
}
// tamanho na tela de cada página: largura da tela × zoom
function escalas(){
  const w = $('pv-body').clientWidth - 20;
  return pv.ws.map((v) => (w / v.width) * pv.zoom);
}
function tamanhoCss(){
  const cs = $('pv-pages').querySelectorAll('canvas, img'), es = escalas();
  cs.forEach((c, i) => { c.style.width = Math.round(pv.ws[i].width * es[i]) + 'px'; c.style.height = Math.round(pv.ws[i].height * es[i]) + 'px'; });
}
let renderTimer = 0;
async function desenharPrancha(){
  if (!pv.doc) return;
  tamanhoCss();
  const tk = pv.token, cs = $('pv-pages').querySelectorAll('canvas'), es = escalas();
  for (let i = 0; i < cs.length; i++) {
    const page = await pv.doc.getPage(i + 1); if (tk !== pv.token) return;
    // nitidez da tela, limitada para não estourar a memória do celular
    let px = es[i] * Math.min(devicePixelRatio || 1, 3);
    const area = pv.ws[i].width * pv.ws[i].height * px * px, MAX = 14e6;
    if (area > MAX) px *= Math.sqrt(MAX / area);
    const vp = page.getViewport({ scale: px }), off = document.createElement('canvas');
    off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
    await page.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise;
    if (tk !== pv.token) return;
    const c = cs[i]; c.width = off.width; c.height = off.height; c.getContext('2d').drawImage(off, 0, 0);
  }
}
function zoomPara(z, mx, my){
  const body = $('pv-body'), r = body.getBoundingClientRect();
  if (mx == null) { mx = r.width / 2; my = r.height / 2; }
  z = Math.min(8, Math.max(1, z)); const k = z / pv.zoom; if (k === 1) return;
  const px = body.scrollLeft + mx, py = body.scrollTop + my;
  pv.zoom = z; tamanhoCss();
  body.scrollLeft = px * k - mx; body.scrollTop = py * k - my;
  clearTimeout(renderTimer); pv.token++; renderTimer = setTimeout(desenharPrancha, 120);
}
$('pv-back').onclick = () => fecharPrancha(false);
$('pv-mais').onclick = () => zoomPara(pv.zoom * 1.5);
$('pv-menos').onclick = () => zoomPara(pv.zoom / 1.5);
addEventListener('popstate', () => { if (pv.hist) { pv.hist = false; fecharPrancha(true); } });
addEventListener('resize', () => { if (!$('pdfv').hidden && !pv.doc && pv.ws.length) tamanhoCss(); else if (!$('pdfv').hidden && pv.doc) { clearTimeout(renderTimer); pv.token++; renderTimer = setTimeout(desenharPrancha, 200); } });
// pinça com dois dedos para ampliar
(() => {
  const body = $('pv-body'), pages = $('pv-pages'); let g = null;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  body.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 2 || !pv.ws.length) return;
    const r = body.getBoundingClientRect();
    g = { d0: dist(e.touches), mx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, my: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top, k: 1 };
    pages.style.transformOrigin = `${body.scrollLeft + g.mx}px ${body.scrollTop + g.my}px`;
  }, { passive: true });
  body.addEventListener('touchmove', (e) => {
    if (!g || e.touches.length !== 2) return;
    e.preventDefault();
    g.k = Math.min(8 / pv.zoom, Math.max(1 / pv.zoom, dist(e.touches) / g.d0));
    pages.style.transform = `scale(${g.k})`;
  }, { passive: false });
  const fim = () => { if (!g) return; const { k, mx, my } = g; g = null; pages.style.transform = ''; zoomPara(pv.zoom * k, mx, my); };
  body.addEventListener('touchend', fim); body.addEventListener('touchcancel', fim);
  // dois toques rápidos: amplia ali / volta ao tamanho da tela
  let ult = 0;
  body.addEventListener('touchend', (e) => {
    if (e.touches.length || e.changedTouches.length !== 1) return;
    const now = Date.now(), t = e.changedTouches[0], r = body.getBoundingClientRect();
    if (now - ult < 300) { ult = 0; zoomPara(pv.zoom > 1.2 ? 1 : 2.5, t.clientX - r.left, t.clientY - r.top); } else ult = now;
  });
  body.addEventListener('dblclick', (e) => { const r = body.getBoundingClientRect(); zoomPara(pv.zoom > 1.2 ? 1 : 2.5, e.clientX - r.left, e.clientY - r.top); });
})();

function refresh(){ renderTopo(); renderLegenda(); pintar(); if (!probAberto) renderSheet(); renderLista(); }

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('pdfv').hidden) fecharPrancha(false); else if (!$('list').hidden) fecharLista(); else fecharSheet(); } });
refresh();
setSync(fila.length ? 'wait' : 'wait', 'Conectando…');
puxar().then(() => { refresh(); enviar(); });
puxarPlanilha();
carregarFotosLocais().then(() => { if (sel) refresh(); enviar(); });
setInterval(() => { if (document.visibilityState === 'visible') { if (fila.length) enviar(); else puxar().then(refresh); } }, 30000);
addEventListener('online', () => enviar());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { puxarPlanilha(); puxar().then(() => { refresh(); enviar(); }); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data?.type === 'model-updated') toast('Modelo atualizado — recarregue para ver'); });
