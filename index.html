<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elétrica 3D — Obra do Fábio</title>
<meta name="description" content="Visualizador 3D das instalações elétricas da obra do Fábio, por pavimento, para análise do serviço a ser executado em campo.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f6;--panel:#ffffff;--panel-2:#f5f7fa;--text:#0d1b2a;--text-dim:#52657a;
    --border:#cdd8e3;--accent:#c9700f;--accent-ink:#fff7ec;--viewport:#0a1929;
    --shadow:0 8px 24px -8px rgba(13,27,42,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1119;--panel:#131c28;--panel-2:#0f1720;--text:#e8edf3;
      --text-dim:#8ea0b5;--border:#233045;--accent:#ffb020;--accent-ink:#1a1200;
      --shadow:0 8px 28px -8px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1119;--panel:#131c28;--panel-2:#0f1720;--text:#e8edf3;
    --text-dim:#8ea0b5;--border:#233045;--accent:#ffb020;--accent-ink:#1a1200;
    --shadow:0 8px 28px -8px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

  .topbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--panel);border-bottom:1px solid var(--border);z-index:20;}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;letter-spacing:.07em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
  .brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .file{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;}
  @media (min-width:640px){ .brand .file{ display:inline; } }

  .floor-switch{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:3px;flex:none;}
  .floor-btn{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-family:"Public Sans",sans-serif;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .floor-btn.active{background:var(--accent);color:var(--accent-ink);}
  .floor-btn:disabled{cursor:default;opacity:.55;}
  .floor-btn .soon{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;margin-left:6px;opacity:.85;}

  .topbar-spacer{flex:1;}
  .stat-chip{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;white-space:nowrap;}
  .stat-chip b{color:var(--text);font-weight:600;}
  .tomada-progress{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;flex:none;}
  .tomada-progress .tp-track{width:74px;height:6px;border-radius:3px;background:rgba(255,176,32,.22);overflow:hidden;flex:none;}
  .tomada-progress .tp-fill{height:100%;width:0%;background:#2ecc71;transition:width .2s ease;}
  .tomada-progress .tp-text{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.3;color:var(--text-dim);white-space:nowrap;}
  .tomada-progress .tp-text b{color:var(--text);font-weight:700;font-size:12.5px;}
  .tomada-progress .tp-text .tp-exec{color:#8beab0;font-weight:600;}
  .tomada-progress .tp-text .tp-pend{color:#ffcf80;font-weight:600;}
  .tomada-progress .tp-text .tp-nc{color:#ffaaaa;font-weight:600;}
  .stats-row{display:none;gap:8px;}
  @media (min-width:960px){ .stats-row{ display:flex; } }
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;flex:none;}
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .stage{position:relative;flex:1;min-height:0;background:var(--viewport);}
  #canvas-holder{position:absolute;inset:0;}
  #canvas-holder canvas{display:block;width:100%;height:100%;touch-action:none;}

  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--viewport);color:#dfe9f5;font-family:"IBM Plex Mono",monospace;z-index:30;transition:opacity .35s ease;}
  #loading .mono-label{font-size:12px;letter-spacing:.08em;color:#7f97b3;text-transform:uppercase;}
  #loading .pct{font-family:"Archivo",sans-serif;font-weight:800;font-size:34px;color:#fff;}
  .bar-track{width:220px;height:5px;border-radius:3px;background:#1c3654;overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:var(--accent);transition:width .15s ease;}
  #loading.hide{opacity:0;pointer-events:none;}
  #load-error{display:none;color:#ff8a80;font-size:12px;max-width:280px;text-align:center;line-height:1.5;}

  .toolbar{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:rgba(19,28,40,0.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px;z-index:15;}
  .toolbar .icon-btn{background:transparent;border:1px solid transparent;color:#dfe9f5;}
  .toolbar .icon-btn:hover{background:rgba(255,255,255,0.08);}
  .toolbar .icon-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .toolbar hr{width:100%;border:none;border-top:1px solid rgba(255,255,255,0.12);margin:2px 0;}

  #sel-bar{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 160px));background:rgba(19,28,40,0.9);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:9px 14px;color:#eaf1f8;display:none;align-items:center;gap:10px;z-index:16;}
  #sel-bar.show{display:flex;}
  #sel-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
  #sel-bar .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #sel-bar .path{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#8ea0b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #sel-bar button{margin-left:auto;flex:none;background:none;border:none;color:#8ea0b5;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  #sel-bar{align-items:flex-start;}
  #sel-bar .dot{margin-top:5px;}
  .sel-measures{display:none;flex-wrap:wrap;align-items:center;gap:3px 12px;margin-top:5px;}
  .sel-measures.show{display:flex;}
  .sel-measures .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#a9b8c9;white-space:nowrap;cursor:help;}
  .sel-measures .m b{color:#fff2df;font-weight:600;}
  .sel-measures .status-chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;cursor:help;}
  .sel-measures .status-chip .sdot{width:6px;height:6px;border-radius:50%;flex:none;}
  .status-executado{background:rgba(46,204,113,0.16);color:#8beab0;}
  .status-executado .sdot{background:#2ecc71;}
  .status-pendente{background:rgba(255,176,32,0.16);color:#ffcf80;}
  .status-pendente .sdot{background:#ffb020;}
  .status-nao-conforme{background:rgba(255,90,90,0.16);color:#ffaaaa;}
  .status-nao-conforme .sdot{background:#ff5a5a;}
  .status-outro{background:rgba(142,160,181,0.16);color:#c7d3e0;}
  .status-outro .sdot{background:#8ea0b5;}
  .status-none{background:rgba(142,160,181,0.1);color:#8ea0b5;}
  .status-none .sdot{background:#54637a;}

  .panel-toggle{position:absolute;right:12px;top:12px;z-index:15;background:rgba(19,28,40,0.82);border:1px solid rgba(255,255,255,0.08);color:#dfe9f5;}

  #panel{position:absolute;top:0;right:0;bottom:0;width:300px;max-width:86vw;background:var(--panel);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(0);transition:transform .25s ease;display:flex;flex-direction:column;z-index:14;}
  #panel.closed{transform:translateX(100%);}
  .panel-head{flex:none;padding:14px 14px 10px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-family:"Archivo",sans-serif;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-dim);margin:0 0 10px;}
  .search-wrap{position:relative;}
  .search-wrap input{width:100%;padding:8px 10px 8px 32px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px;font-family:"Public Sans",sans-serif;}
  .search-wrap input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-dim);fill:none;stroke-width:2;}
  .search-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--text-dim);}
  .search-meta button{font-family:"Public Sans",sans-serif;font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;}
  .cat-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .cat-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel-2);border-radius:999px;padding:5px 10px;font-family:"Public Sans",sans-serif;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .cat-chip .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-chip.active{border-color:var(--accent);color:var(--text);}
  .cat-chip .n{font-family:"IBM Plex Mono",monospace;color:var(--text-dim);}
  .panel-body{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 14px;}
  .tree-node{margin:1px 0;}
  .tree-row{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;}
  .tree-row:hover{background:var(--panel-2);}
  .tree-row .caret{width:14px;height:14px;flex:none;color:var(--text-dim);transition:transform .15s ease;}
  .tree-row.expanded .caret{transform:rotate(90deg);}
  .tree-row .caret.leaf{visibility:hidden;}
  .tree-row .vis{flex:none;width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .tree-row .vis.on{border-color:var(--accent);background:var(--accent);}
  .tree-row .vis svg{width:10px;height:10px;stroke:var(--accent-ink);stroke-width:3;display:none;}
  .tree-row .vis.on svg{display:block;}
  .tree-row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tree-row .count{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);background:var(--panel-2);border-radius:5px;padding:1px 5px;}
  .tree-row.selected{background:var(--accent);color:var(--accent-ink);}
  .tree-row.selected .count{background:rgba(0,0,0,0.15);color:inherit;}
  .tree-row.selected .vis{border-color:var(--accent-ink);}
  .tree-children{margin-left:18px;display:none;}
  .tree-children.open{display:block;}
  .empty-hint{padding:20px 10px;text-align:center;color:var(--text-dim);font-size:12.5px;line-height:1.6;}
  .panel-foot{flex:none;border-top:1px solid var(--border);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  .kv{display:flex;flex-direction:column;gap:2px;}
  .kv .k{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);}
  .kv .v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .panel-handle{display:none;flex:none;justify-content:center;padding:9px 0 3px;cursor:grab;}
  .panel-handle span{width:36px;height:4px;border-radius:2px;background:var(--border);}

  @media (max-width:640px){
    .brand{flex-direction:column;align-items:flex-start;gap:1px;}
    .brand .mark{font-size:10.5px;}
    .brand h1{font-size:14px;}

    .icon-btn{width:42px;height:42px;}
    .icon-btn svg{width:20px;height:20px;}
    .floor-btn{padding:8px 13px;font-size:12.5px;}
    .tomada-progress{padding:6px 10px;gap:7px;}
    .tomada-progress .tp-track{width:52px;}
    .tomada-progress .tp-text{font-size:10px;}
    .cat-chip{padding:7px 12px;font-size:12.5px;}
    .search-wrap input{padding:11px 10px 11px 34px;font-size:14px;}

    .panel-handle{display:flex;}
    #panel{
      top:auto;left:0;right:0;bottom:0;
      width:100%;max-width:100%;
      height:68vh;
      border-left:none;
      border-top:1px solid var(--border);
      border-radius:16px 16px 0 0;
      transform:translateY(0);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    #panel.closed{transform:translateY(100%);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">Obra &mdash; Fábio e Brunielly (L14Q13)</span>
      <h1 id="floor-title">Térreo</h1>
    </div>
    <div class="floor-switch" id="floor-switch"></div>
    <div class="tomada-progress" id="tomada-progress" title="Progresso de execução das tomadas (propriedade Marca no Revit)" style="display:none;">
      <div class="tp-track"><div class="tp-fill" id="tp-fill"></div></div>
      <div class="tp-text" id="tp-text">&mdash;</div>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="theme-btn" title="Alternar tema da interface">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="stage">
    <div id="canvas-holder"></div>

    <div id="loading">
      <div class="mono-label">Carregando modelo</div>
      <div class="pct" id="load-pct">0%</div>
      <div class="bar-track"><div class="bar-fill" id="load-bar"></div></div>
      <div id="load-error"></div>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="icon-btn" id="btn-reset" title="Enquadrar modelo">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      </button>
      <button class="icon-btn" id="btn-wire" title="Alternar wireframe">
        <svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M3 8l9 5M21 8l-9 5M12 13v8"/></svg>
      </button>
      <button class="icon-btn" id="btn-grid" title="Alternar grade">
        <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18" /><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="btn-bg" title="Fundo claro / escuro">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <hr>
      <button class="icon-btn" id="btn-full" title="Tela cheia">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <button class="icon-btn panel-toggle" id="panel-toggle" title="Mostrar/ocultar painel">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg>
    </button>

    <div id="sel-bar">
      <span class="dot"></span>
      <div style="min-width:0;">
        <div class="name" id="sel-name">&mdash;</div>
        <div class="path" id="sel-path"></div>
        <div class="sel-measures" id="sel-measures"></div>
      </div>
      <button id="sel-close" title="Fechar">&times;</button>
    </div>
  </div>

  <div id="panel">
    <div class="panel-handle" id="panel-handle"><span></span></div>
    <div class="panel-head">
      <h2>Elementos do modelo</h2>
      <div class="cat-filters" id="cat-filters"></div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Buscar (ex: tomada, eletroduto, quadro)" autocomplete="off">
      </div>
      <div class="search-meta">
        <span id="search-count"></span>
        <button id="search-clear" style="display:none;">Limpar</button>
      </div>
    </div>
    <div class="panel-body" id="tree-root">
      <div class="empty-hint">Carregando estrutura do modelo&hellip;</div>
    </div>

  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- Pavimentos ----------------
   Cada obra tem vários pavimentos. Térreo e Pavimento Superior já têm
   modelo publicado; para um novo pavimento, suba o .glb nesta mesma pasta,
   adicione uma entrada aqui e aponte "file" para esse arquivo. */
const FLOORS = [
  { id: 'terreo', label: 'Térreo', file: 'Elétrica-terreo.glb', available: true },
  { id: 'pav1', label: 'Pavimento Superior', file: 'Elétrica-primeiropavimento.glb', available: true },
];
let currentFloor = null;

const holder = document.getElementById('canvas-holder');
const themeRoot = document.documentElement;

/* ---------------- Renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const VIEWPORT_DARK = 0x0a1929;
const VIEWPORT_LIGHT = 0xf4f6f8;
const GRID_DARK = [0x2f537a, 0x1c3654];
const GRID_LIGHT = [0x9aa7b3, 0xd3d9de];
let bgIsDark = false;
scene.background = new THREE.Color(VIEWPORT_LIGHT);
scene.fog = new THREE.Fog(VIEWPORT_LIGHT, 40, 220);

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
camera.position.set(8, 7, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.01;
controls.maxDistance = 800;
controls.zoomSpeed = 2.5;

const hemi = new THREE.HemisphereLight(0xdfe9f5, 0x0a1524, 1.1);
scene.add(hemi);
const dir1 = new THREE.DirectionalLight(0xffffff, 1.4);
dir1.position.set(12, 18, 8);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x6f9fd8, 0.5);
dir2.position.set(-14, 6, -10);
scene.add(dir2);

function makeGrid(colors){
  const g = new THREE.GridHelper(200, 80, colors[0], colors[1]);
  g.material.transparent = true;
  g.material.opacity = 0.55;
  return g;
}
let grid = makeGrid(GRID_LIGHT);
scene.add(grid);

const modelGroup = new THREE.Group();
scene.add(modelGroup);

function resize(){
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h,1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

/* ---------------- Categorias (estrutura / conduítes / tomadas) ----------------
   O modelo não traz materiais do Revit — os nomes de família é que carregam
   a informação. Classificamos por padrão de texto e pintamos cada grupo. */
const CATEGORY_STYLE = {
  estrutura: { color: 0x9aa4b2, metalness: 0.85, roughness: 0.28, opacity: 0.3, label: 'Estrutura LSF' },
  conduite:  { color: 0xffd400, metalness: 0.05, roughness: 0.4, opacity: 1, label: 'Conduítes' },
  tomada:    { color: 0xf2efe8, metalness: 0.05, roughness: 0.35, opacity: 1, label: 'Tomadas' },
  suporte:   { color: 0x5b8ac9, metalness: 0.5, roughness: 0.45, opacity: 1, label: 'Suportes de Caixa' },
  outro:     { color: 0xb6bec8, metalness: 0.25, roughness: 0.6, opacity: 1, label: 'Outros' },
};
const CATEGORY_ORDER = ['estrutura', 'conduite', 'tomada', 'suporte', 'outro'];
const categoryMaterials = {};
function materialFor(cat){
  if (!categoryMaterials[cat]) {
    const s = CATEGORY_STYLE[cat];
    categoryMaterials[cat] = new THREE.MeshStandardMaterial({
      color: s.color, metalness: s.metalness, roughness: s.roughness,
      transparent: (s.opacity ?? 1) < 1, opacity: s.opacity ?? 1,
    });
  }
  return categoryMaterials[cat];
}
function categorize(fullPath){
  const n = fullPath.toLowerCase();
  if (/perfil.*lsf/.test(n)) return 'suporte'; // perfis LSF usados como suporte de caixa elétrica
  if (/conduite|eletroduto|caixa/.test(n)) return 'conduite';
  if (/tomada/.test(n)) return 'tomada';
  return 'estrutura'; // neste modelo, tudo que não é elétrica é estrutura LSF
}
let activeCats = new Set();

function frameToSphere(sphere){
  const r = Math.max(sphere.radius, 0.5);
  const dir = new THREE.Vector3(0.85, 0.65, 1).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15;
  const target = sphere.center.clone();
  const pos = target.clone().add(dir.multiplyScalar(dist));
  camera.position.copy(pos);
  camera.near = Math.max(r / 200, 0.01);
  camera.far = Math.max(r * 40, 100);
  camera.updateProjectionMatrix();
  controls.target.copy(target);
  controls.update();
}

/* ---------------- Index + tree ---------------- */
function buildIndex(root){
  root.traverse((obj) => {
    if (obj.isMesh) {
      /* Alguns exportadores (ex.: Leia/e-verse) não gravam normais de vértice no
         glTF. Sem normal o three.js não tem como calcular luz na superfície e a
         peça renderiza preta, seja qual for a cor do material — por isso
         recalculamos aqui quando faltar. */
      if (!obj.geometry.attributes.normal) {
        obj.geometry.computeVertexNormals();
      }
      const path = [];
      let p = obj;
      while (p && p !== modelGroup) { if (p.name) path.unshift(p.name); p = p.parent; }
      const fullPath = path.join(' / ');
      const cat = categorize(fullPath || obj.name || '');
      obj.material = materialFor(cat);
      allMeshes.push(obj);
      meshIndex.push({ mesh: obj, name: obj.name || '(sem nome)', path: fullPath, cat });
    }
  });
}

function computeMeasurements(){
  meshIndex.forEach((entry) => {
    entry.box = new THREE.Box3().setFromObject(entry.mesh);
    entry.center = entry.box.getCenter(new THREE.Vector3());
    entry.pointGroup = null;
  });

  const floorSource = meshIndex.filter((e) => e.cat === 'estrutura');
  const overall = new THREE.Box3();
  meshIndex.forEach((e) => overall.union(e.box));
  floorLevelY = floorSource.length ? Math.min(...floorSource.map((e) => e.box.min.y)) : (overall.isEmpty() ? 0 : overall.min.y);

  /* Um ponto de tomada real vira vários meshes no glTF (moldura + módulos).
     Agrupamos por proximidade em planta (x,z) para tratar como um único ponto. */
  const CLUSTER_XZ_EPS = 0.12;
  tomadaClusters = [];
  meshIndex.filter((e) => e.cat === 'tomada').forEach((entry) => {
    let target = tomadaClusters.find((c) => Math.hypot(c.x - entry.center.x, c.z - entry.center.z) < CLUSTER_XZ_EPS);
    if (!target) {
      target = { entries: [], box: new THREE.Box3(), x: entry.center.x, z: entry.center.z };
      tomadaClusters.push(target);
    }
    target.entries.push(entry);
    target.box.union(entry.box);
  });
  tomadaClusters.forEach((c) => {
    c.center = c.box.getCenter(new THREE.Vector3());
    c.entries.forEach((e) => { e.pointGroup = c; });
  });
}

/* Lê propriedades vindas do Revit (Comentários / Altura / Elevação / Marca) que sobrevivem
   à exportação para glTF/GLB (extras por node -> mesh.userData no three.js).
   Convenção do projeto:
     - "Marca"             -> status de execução (Pendente / Executado / Não conforme)
     - "Altura"/"Elevação" -> altura do ponto, quando informada no Revit
     - "Comentários"       -> nota livre (ex.: distância da parede)
   Parâmetros de TIPO (prefixo "Type ..." — ex.: "Type Comentários de tipos") são
   ignorados: são metadado da família/tipo, iguais para todo elemento daquele tipo,
   não é dado da instância nem da vistoria. Um "cluster" de tomada (point) junta vários
   nodes do glTF (o conjunto + seus módulos internos); o módulo interno tem sua própria
   "Marca" (numeração automática do Revit, não é status) — por isso só aceitamos como
   status um valor de Marca que realmente bate com Pendente/Executado/Não conforme. */
function parseRevitNumber(raw){
  if (raw === undefined || raw === null) return NaN;
  const cleaned = String(raw).trim().replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function pointAnnotation(point){
  let altura = '', comentario = '', status = '';
  point.entries.forEach((e) => {
    const ud = e.mesh.userData || {};
    /* O exportador Leia/e-verse guarda os parâmetros do Revit dentro de
       um objeto aninhado ("extras.parameters"), não soltos no nível
       raiz do extras. Usamos esse objeto quando existir; caso contrário
       caímos de volta pro userData direto (outros exportadores). */
    const params = (ud.parameters && typeof ud.parameters === 'object') ? ud.parameters : ud;
    Object.keys(params).forEach((k) => {
      if (/^type[\s_]/i.test(k)) return; // parâmetro de Tipo, não de instância
      const val = params[k];
      if (val === undefined || val === null || val === '') return;
      const key = k.toLowerCase();
      if (!altura && /altura|height|eleva[cç][aã]o/.test(key)) {
        const num = parseRevitNumber(val);
        altura = isFinite(num) ? fmtDist(num) : String(val);
      }
      if (!comentario && /coment|comment/.test(key)) comentario = String(val);
      if (/marca|mark/.test(key)) {
        const s = String(val);
        const norm = normalizeStatus(s);
        if (!status && norm && norm.key !== 'outro') status = s;
      }
    });
  });
  return { altura, comentario, status };
}

function normalizeStatus(raw){
  const s = (raw || '').trim().toLowerCase();
  if (!s) return null;
  if (/execut/.test(s)) return { key: 'executado', label: 'Executado' };
  if (/pendent/.test(s)) return { key: 'pendente', label: 'Pendente' };
  if (/n[aã]o\s*conforme|reprov/.test(s)) return { key: 'nao-conforme', label: 'Não conforme' };
  return { key: 'outro', label: raw.trim() };
}

/* Quantitativo de tomadas por status (Pendente/Executado/Não conforme), lido
   da mesma propriedade "Marca" usada no balão de seleção. Mostrado no topo
   da tela para acompanhamento rápido do avanço da instalação em campo. */
function computeTomadaStatusCounts(){
  const counts = { executado: 0, pendente: 0, 'nao-conforme': 0, outro: 0, semStatus: 0 };
  tomadaClusters.forEach((c) => {
    const ann = pointAnnotation(c);
    const norm = normalizeStatus(ann.status);
    if (!norm) { counts.semStatus++; return; }
    if (norm.key === 'executado') counts.executado++;
    else if (norm.key === 'pendente') counts.pendente++;
    else if (norm.key === 'nao-conforme') counts['nao-conforme']++;
    else counts.outro++;
  });
  return counts;
}

function renderTomadaProgress(){
  const total = tomadaClusters.length;
  if (!total) { tomadaProgressEl.style.display = 'none'; return; }
  const counts = computeTomadaStatusCounts();
  const pct = Math.round((counts.executado / total) * 100);
  tpFillEl.style.width = pct + '%';
  let title = 'Tomadas: ' + counts.executado + ' executadas, ' + counts.pendente + ' pendentes';
  if (counts['nao-conforme']) title += ', ' + counts['nao-conforme'] + ' não conformes';
  if (counts.semStatus) title += ', ' + counts.semStatus + ' sem status no Revit';
  title += ' — de ' + total + ' tomadas neste pavimento.';
  tomadaProgressEl.title = title;
  tpTextEl.innerHTML = '<b>' + pct + '%</b> executado &nbsp; ' +
    '<span class="tp-exec">' + counts.executado + ' exec.</span> &nbsp; ' +
    '<span class="tp-pend">' + counts.pendente + ' pend.</span>' +
    (counts['nao-conforme'] ? ' &nbsp; <span class="tp-nc">' + counts['nao-conforme'] + ' n/c</span>' : '');
  tomadaProgressEl.style.display = '';
}

function statusOutlineColor(rawStatus){
  const norm = normalizeStatus(rawStatus);
  if (norm && norm.key === 'executado') return 0x2ecc71;
  if (norm && norm.key === 'nao-conforme') return 0xff5a5a;
  return 0xffb020;
}

function statusChip(rawStatus){
  const norm = normalizeStatus(rawStatus);
  const span = document.createElement('span');
  span.className = 'status-chip status-' + (norm ? norm.key : 'none');
  span.title = norm
    ? 'Status vindo da propriedade "Marca" no Revit.'
    : 'Nenhum status definido no Revit (propriedade "Marca") para este ponto.';
  const dot = document.createElement('span');
  dot.className = 'sdot';
  span.appendChild(dot);
  const label = document.createElement('span');
  label.textContent = norm ? norm.label : 'Sem status';
  span.appendChild(label);
  return span;
}

function pointLabel(point){
  const withElementId = point.entries.find((e) => e.mesh.userData && e.mesh.userData.elementId);
  if (withElementId) {
    return 'Tomada #' + withElementId.mesh.userData.elementId;
  }
  const withBracket = point.entries.find((e) => /\[\d+\]/.test(e.name));
  if (withBracket) {
    const m = withBracket.name.match(/\[(\d+)\]/);
    return 'Tomada ' + (m ? '#' + m[1] : withBracket.name);
  }
  return bestLabel(point.entries[0]);
}

function fmtDist(v){
  if (!isFinite(v)) return '—';
  if (Math.abs(v) < 3) return Math.round(v * 100) + ' cm';
  return v.toFixed(2).replace('.', ',') + ' m';
}

function measureChip(label, value, title){
  const span = document.createElement('span');
  span.className = 'm';
  span.title = title;
  span.textContent = label + ': ';
  const b = document.createElement('b');
  b.textContent = value;
  span.appendChild(b);
  return span;
}

function debugPointData(point){
  console.group('[campo3d] Propriedades Revit do ponto selecionado (' + point.entries.length + ' node(s) agrupados)');
  point.entries.forEach((e) => {
    const ud = e.mesh.userData || {};
    console.log(e.name, Object.keys(ud).length ? ud : '(sem extras/custom properties neste node)');
  });
  console.groupEnd();
}

function renderMeasures(point){
  selMeasures.innerHTML = '';
  if (!point) { selMeasures.classList.remove('show'); return; }
  const ann = pointAnnotation(point);
  debugPointData(point);

  selMeasures.appendChild(statusChip(ann.status));
  selMeasures.appendChild(measureChip(
    'Altura',
    ann.altura || '— sem altura no Revit —',
    ann.altura ? 'Altura informada no Revit (Altura/Elevação do Ponto).' : 'Nenhuma altura vinda do Revit para este ponto (propriedade Altura/Elevação do Ponto vazia ou ausente).'
  ));
  selMeasures.appendChild(measureChip(
    'Comentário',
    ann.comentario || '— sem nota do Revit —',
    'Comentário vindo do Revit (propriedade Comentários).'
  ));
  selMeasures.classList.add('show');
}

function renderCategoryFilters(){
  const el = document.getElementById('cat-filters');
  el.innerHTML = '';
  const counts = {};
  meshIndex.forEach((m) => { counts[m.cat] = (counts[m.cat] || 0) + 1; });
  CATEGORY_ORDER.forEach((cat) => {
    const n = counts[cat] || 0;
    if (!n) return;
    const style = CATEGORY_STYLE[cat];
    const hex = '#' + style.color.toString(16).padStart(6, '0');
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'cat-chip' + (activeCats.has(cat) ? ' active' : '');
    chip.innerHTML = '<span class="swatch" style="background:' + hex + '"></span>' + style.label + ' <span class="n">' + n + '</span>';
    chip.addEventListener('click', () => {
      if (activeCats.has(cat)) activeCats.delete(cat); else activeCats.add(cat);
      renderCategoryFilters();
      applyFilters();
    });
    el.appendChild(chip);
  });
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const box = new THREE.Box3();
  let count = 0;
  meshIndex.forEach((entry) => {
    const matchesCat = activeCats.size === 0 || activeCats.has(entry.cat);
    const matchesQuery = !q || (entry.name + ' ' + entry.path).toLowerCase().includes(q);
    const visible = matchesCat && matchesQuery;
    entry.mesh.visible = visible;
    if (visible) { count++; box.expandByObject(entry.mesh); }
  });
  const filtering = !!q || activeCats.size > 0;
  searchCount.textContent = filtering ? (count + (count === 1 ? ' item encontrado' : ' itens encontrados')) : '';
  searchClear.style.display = filtering ? 'inline' : 'none';
  if (filtering && count > 0) {
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    if (sphere.radius > 0) frameToSphere(sphere);
  }
}

function resetFilters(){
  activeCats.clear();
  searchInput.value = '';
  renderCategoryFilters();
  applyFilters();
  frameToSphere(fitSphere);
}

/* A árvore mostra só duas frentes de trabalho: Estrutura LSF e Elétrica
   (conduítes + tomadas). O resto do modelo continua visível na cena, só
   não some poluindo esta lista. */
const TREE_ITEM_CAP = 300;

function buildTree(){
  treeRoot.innerHTML = '';
  const groups = { estrutura: [], eletrica: [] };
  meshIndex.forEach((entry) => {
    if (entry.cat === 'estrutura') groups.estrutura.push(entry);
    else if (entry.cat === 'conduite' || entry.cat === 'tomada' || entry.cat === 'suporte') groups.eletrica.push(entry);
  });
  const defs = [
    { label: 'Estrutura LSF', items: groups.estrutura },
    { label: 'Elétrica', items: groups.eletrica },
  ];
  let any = false;
  defs.forEach((def) => {
    if (!def.items.length) return;
    any = true;
    treeRoot.appendChild(renderGroup(def.label, def.items));
  });
  if (!any) treeRoot.innerHTML = '<div class="empty-hint">Nenhum elemento reconhecido neste pavimento.</div>';
}

const DESCRIPTIVE_NAME = /perfil|lsf|conduite|eletroduto|tomada|caixa/i;
function bestLabel(entry){
  const segs = entry.path ? entry.path.split(' / ') : [];
  for (let i = segs.length - 1; i >= 0; i--) {
    if (DESCRIPTIVE_NAME.test(segs[i])) return segs[i];
  }
  return (entry.name && entry.name !== '(sem nome)') ? entry.name : (segs[segs.length - 1] || entry.name);
}

function renderGroup(label, items){
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';

  const childrenEl = document.createElement('div');
  childrenEl.className = 'tree-children';
  items.slice(0, TREE_ITEM_CAP).forEach((entry) => childrenEl.appendChild(renderLeaf(entry)));
  if (items.length > TREE_ITEM_CAP) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.style.padding = '8px 4px';
    hint.textContent = '+' + (items.length - TREE_ITEM_CAP) + ' itens — use a busca acima para achar um específico.';
    childrenEl.appendChild(hint);
  }

  const row = document.createElement('div');
  row.className = 'tree-row';
  row.appendChild(svgIcon('M9 6l6 6-6 6', 'caret'));

  const groupVis = document.createElement('span');
  groupVis.className = 'vis on';
  groupVis.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"></polyline></svg>';
  groupVis.title = 'Mostrar/ocultar grupo inteiro';
  groupVis.addEventListener('click', (e) => {
    e.stopPropagation();
    const nowVisible = !groupVis.classList.contains('on');
    groupVis.classList.toggle('on', nowVisible);
    items.forEach((entry) => { entry.mesh.visible = nowVisible; });
    childrenEl.querySelectorAll('.vis').forEach((v) => v.classList.toggle('on', nowVisible));
  });
  row.appendChild(groupVis);

  const labelEl = document.createElement('span');
  labelEl.className = 'label';
  labelEl.style.fontWeight = '700';
  labelEl.textContent = label;
  row.appendChild(labelEl);

  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = items.length;
  row.appendChild(count);

  wrap.appendChild(row);
  wrap.appendChild(childrenEl);

  row.addEventListener('click', () => {
    const open = childrenEl.classList.toggle('open');
    row.classList.toggle('expanded', open);
  });

  return wrap;
}

function renderLeaf(entry){
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';
  const row = document.createElement('div');
  row.className = 'tree-row';
  row.appendChild(svgIcon('M9 6l6 6-6 6', 'caret leaf'));

  const vis = document.createElement('span');
  vis.className = 'vis on';
  vis.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"></polyline></svg>';
  vis.title = 'Mostrar/ocultar';
  vis.addEventListener('click', (e) => {
    e.stopPropagation();
    entry.mesh.visible = !entry.mesh.visible;
    vis.classList.toggle('on', entry.mesh.visible);
  });
  row.appendChild(vis);

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = bestLabel(entry);
  row.appendChild(label);

  row.addEventListener('click', () => selectMesh(entry.mesh, true));
  wrap.appendChild(row);
  return wrap;
}

function svgIcon(path, cls){
  const span = document.createElement('span');
  span.className = cls;
  span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="' + path + '"/></svg>';
  return span;
}

/* ---------------- Selection + outline ---------------- */
function clearSelection(){
  outlineMeshes.forEach((o) => { modelGroup.remove(o); o.geometry.dispose(); });
  outlineMeshes = [];
  selBar.classList.remove('show');
  renderMeasures(null);
  document.querySelectorAll('.tree-row.selected').forEach((r) => r.classList.remove('selected'));
}

function outlineFor(mesh, color){
  const edges = new THREE.EdgesGeometry(mesh.geometry, 20);
  const mat = new THREE.LineBasicMaterial({ color: color === undefined ? 0xffb020 : color, linewidth: 2 });
  const line = new THREE.LineSegments(edges, mat);
  mesh.updateWorldMatrix(true, false);
  line.applyMatrix4(mesh.matrixWorld);
  modelGroup.add(line);
  return line;
}

function selectMesh(mesh, focus){
  clearSelection();
  const entry = meshIndex.find((m) => m.mesh === mesh);
  const point = entry && entry.cat === 'tomada' ? entry.pointGroup : null;
  const outlineTargets = point ? point.entries.map((e) => e.mesh) : [mesh];
  const outlineColor = point ? statusOutlineColor(pointAnnotation(point).status) : 0xffb020;
  outlineMeshes = outlineTargets.map((m) => outlineFor(m, outlineColor));

  /* Só tomadas mostram o balão de informação (status/altura/comentário).
     Os demais elementos (estrutura, conduíte, suporte...) ficam só com o
     destaque visual no 3D, sem nenhum texto exposto. */
  if (point) {
    selName.textContent = pointLabel(point);
    selPath.textContent = '';
    selName.style.display = 'none';
    selPath.style.display = 'none';
    selBar.classList.add('show');
    renderMeasures(point);
  } else {
    selBar.classList.remove('show');
    renderMeasures(null);
  }

  if (focus) {
    const box = point ? point.box : new THREE.Box3().setFromObject(mesh);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    if (sphere.radius > 0) frameToSphere(sphere);
  }
}

document.getElementById('sel-close').addEventListener('click', clearSelection);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (Math.hypot(dx, dy) > 6) return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(allMeshes, false);
  if (hits.length) selectMesh(hits[0].object, false);
});

/* ---------------- Search ---------------- */
searchInput.addEventListener('input', applyFilters);

searchClear.addEventListener('click', resetFilters);

/* ---------------- Pavimentos: troca e carregamento ---------------- */
function renderFloorSwitch(){
  floorSwitchEl.innerHTML = '';
  FLOORS.forEach((f) => {
    const btn = document.createElement('button');
    btn.className = 'floor-btn' + (currentFloor && currentFloor.id === f.id ? ' active' : '');
    btn.disabled = !f.available;
    btn.innerHTML = f.label + (f.available ? '' : '<span class="soon">em breve</span>');
    if (f.available) {
      btn.addEventListener('click', () => {
        if (!currentFloor || currentFloor.id !== f.id) loadFloor(f);
      });
    }
    floorSwitchEl.appendChild(btn);
  });
}

function disposeCurrentModel(){
  while (modelGroup.children.length) {
    const child = modelGroup.children.pop();
    child.traverse((o) => {
      if (o.isMesh) {
        o.geometry.dispose();
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m && m.dispose());
      }
    });
  }
}

function loadFloor(floor){
  currentFloor = floor;
  renderFloorSwitch();
  floorTitle.textContent = floor.label;

  clearSelection();
  disposeCurrentModel();
  meshIndex = [];
  allMeshes = [];
  tomadaClusters = [];
  floorLevelY = 0;
  activeCats = new Set();
  searchInput.value = '';
  searchCount.textContent = '';
  searchClear.style.display = 'none';
  document.getElementById('cat-filters').innerHTML = '';
  treeRoot.innerHTML = '<div class="empty-hint">Carregando estrutura do modelo&hellip;</div>';

  loadingEl.classList.remove('hide');
  document.querySelector('#loading .mono-label').textContent = 'Carregando modelo';
  errEl.style.display = 'none';
  pctEl.textContent = '0%';
  barEl.style.width = '0%';

  let modelBytes = 0;

  loader.load(
    floor.file,
    (gltf) => {
      const root = gltf.scene || gltf.scenes[0];

      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      root.position.sub(center);

      modelGroup.add(root);

      box.setFromObject(modelGroup);
      box.getBoundingSphere(fitSphere);
      frameToSphere(fitSphere);

      buildIndex(root);
      computeMeasurements();
      renderTomadaProgress();
      buildTree();
      renderCategoryFilters();

      loadingEl.classList.add('hide');
    },
    (evt) => {
      if (evt.total) {
        modelBytes = evt.total;
        const p = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
        pctEl.textContent = p + '%';
        barEl.style.width = p + '%';
      }
    },
    (err) => showLoadError(err)
  );
}

function showLoadError(err){
  console.error(err);
  pctEl.textContent = '';
  document.querySelector('#loading .mono-label').textContent = 'Falha ao carregar';
  errEl.style.display = 'block';
  errEl.textContent = 'Não foi possível carregar "' + currentFloor.file + '". Confirme que o arquivo está na mesma pasta desta página.';
}

/* ---------------- Toolbar ---------------- */
let wireOn = false;
document.getElementById('btn-wire').addEventListener('click', (e) => {
  wireOn = !wireOn;
  e.currentTarget.classList.toggle('active', wireOn);
  modelGroup.traverse((o) => {
    if (o.isMesh && o.material) {
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.wireframe = wireOn));
    }
  });
});

let gridOn = true;
document.getElementById('btn-grid').addEventListener('click', (e) => {
  gridOn = !gridOn;
  grid.visible = gridOn;
  e.currentTarget.classList.toggle('active', gridOn);
});
document.getElementById('btn-grid').classList.add('active');

document.getElementById('btn-bg').addEventListener('click', () => {
  bgIsDark = !bgIsDark;
  const c = bgIsDark ? VIEWPORT_DARK : VIEWPORT_LIGHT;
  scene.background = new THREE.Color(c);
  scene.fog.color = new THREE.Color(c);

  const wasVisible = grid.visible;
  scene.remove(grid);
  grid.geometry.dispose();
  grid.material.dispose();
  grid = makeGrid(bgIsDark ? GRID_DARK : GRID_LIGHT);
  grid.visible = wasVisible;
  scene.add(grid);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  clearSelection();
  resetFilters();
});

document.getElementById('btn-full').addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
});

const panel = document.getElementById('panel');
document.getElementById('panel-toggle').addEventListener('click', () => panel.classList.toggle('closed'));
if (window.innerWidth < 640) panel.classList.add('closed');

let themeMode = 'auto';
document.getElementById('theme-btn').addEventListener('click', () => {
  themeMode = themeMode === 'dark' ? 'light' : themeMode === 'light' ? 'auto' : 'dark';
  if (themeMode === 'auto') themeRoot.removeAttribute('data-theme');
  else themeRoot.setAttribute('data-theme', themeMode);
});

/* ---------------- Início ---------------- */
loadFloor(FLOORS.find((f) => f.available) || FLOORS[0]);
</script>
</body>
