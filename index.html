<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elétrica 3D — Obra do Fábio</title>
<meta name="description" content="Visualizador 3D das instalações elétricas da obra do Fábio, por pavimento e ambiente, para análise do serviço a ser executado em campo.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/campo3d.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#eef2f6;--panel:#ffffff;--panel-2:#f5f7fa;--text:#0d1b2a;--text-dim:#52657a;
    --border:#cdd8e3;--accent:#c9700f;--accent-ink:#fff7ec;--accent-soft:rgba(201,112,15,.14);--viewport:#f4f6f8;
    --overlay:rgba(19,28,40,0.86);--overlay-ink:#dfe9f5;--overlay-dim:#8ea0b5;
    --ok:#2ecc71;--warn:#ffb020;--bad:#ff5a5a;--none:#8ea0b5;
    --shadow:0 8px 24px -8px rgba(13,27,42,0.18);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;}
  button{font-family:inherit;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}

  /* ---- Topo ---- */
  .topbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);z-index:20;}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .brand .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:11px;letter-spacing:.07em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
  .brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .floor-switch{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:3px;flex:none;}
  .floor-btn{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .floor-btn.active{background:var(--text);color:#fff;}
  .topbar-spacer{flex:1;}
  .tomada-progress{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:6px 11px;flex:none;cursor:pointer;color:inherit;}
  .tomada-progress:hover{border-color:var(--accent);}
  .tp-track{width:64px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex:none;display:flex;}
  .tp-track i{display:block;height:100%;}
  .tp-text{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.3;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:left;}
  .tp-text b{color:var(--text);font-weight:700;font-size:12px;}
  .tp-exec{color:#1f9d57;font-weight:600;} .tp-pend{color:#b86f00;font-weight:600;} .tp-nc{color:#d13b3b;font-weight:600;}

  /* ---- Abas de ambiente ---- */
  .rooms{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;background:var(--panel);border-bottom:1px solid var(--border);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .rooms::-webkit-scrollbar{display:none;}
  .room-btn{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:7px 12px 6px;cursor:pointer;color:var(--text);text-align:left;}
  .room-btn .rn{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .room-btn .rm{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;}
  .room-btn .rm .off{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);}
  .room-btn.all{border-style:dashed;}
  .room-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .room-btn.active .rm{color:var(--accent-ink);opacity:.85;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .stage{position:relative;flex:1;min-height:0;background:var(--viewport);overflow:hidden;}
  #canvas-holder{position:absolute;inset:0;}
  #canvas-holder canvas{display:block;width:100%;height:100%;touch-action:none;}
  #label-layer{position:absolute;inset:0;pointer-events:none;z-index:5;}

  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(244,246,248,.92);font-family:"IBM Plex Mono",monospace;z-index:30;transition:opacity .3s ease;}
  #loading .mono-label{font-size:11.5px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;text-align:center;padding:0 16px;}
  #loading .pct{font-family:"Archivo",sans-serif;font-weight:800;font-size:32px;}
  .bar-track{width:200px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:var(--accent);transition:width .15s ease;}
  #loading.hide{opacity:0;pointer-events:none;}
  #load-error{display:none;color:#c0392b;font-size:12px;max-width:280px;text-align:center;line-height:1.5;}

  /* ---- Planta-chave ---- */
  #keyplan{position:absolute;left:12px;top:12px;z-index:15;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px 8px 8px;color:var(--overlay-ink);}
  #keyplan .kp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;color:var(--overlay-dim);cursor:pointer;padding:0 0 5px;width:100%;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;}
  #keyplan.min .kp-head{padding:0;}
  #keyplan.min svg.kp{display:none;}
  #keyplan svg.kp{display:block;width:176px;height:auto;}
  .kp rect.room{fill:rgba(255,255,255,.06);stroke:rgba(223,233,245,.45);stroke-width:.35;cursor:pointer;transition:fill .15s;}
  .kp rect.room:hover{fill:rgba(255,255,255,.14);}
  .kp rect.room.active{fill:rgba(201,112,15,.55);stroke:#ffb35c;stroke-width:.6;}
  .kp rect.outline{fill:none;stroke:rgba(223,233,245,.25);stroke-width:.3;stroke-dasharray:1 1;}
  .kp text{fill:#dfe9f5;font-family:"Public Sans",sans-serif;font-size:2.6px;font-weight:700;pointer-events:none;}

  /* ---- Ferramentas ---- */
  .toolbar{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px;z-index:15;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--overlay-ink);cursor:pointer;flex:none;}
  .icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .toolbar hr{width:100%;border:none;border-top:1px solid rgba(255,255,255,0.12);margin:2px 0;}

  .cat-toggle{position:absolute;right:12px;top:12px;z-index:15;display:flex;flex-direction:column;gap:5px;align-items:stretch;}
  .cat-chip{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);background:var(--overlay);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--overlay-dim);cursor:pointer;}
  .cat-chip .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-chip.active{color:#fff;border-color:var(--accent);}
  .cat-chip.cx-chip{cursor:default;color:#eaf1f8;}
  .cat-chip .n{font-family:"IBM Plex Mono",monospace;opacity:.8;margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums;}

  /* ---- Balão da seleção ---- */
  #sel-bar{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100% - 150px));background:rgba(19,28,40,0.94);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:9px 12px;color:#eaf1f8;display:none;align-items:flex-start;gap:10px;z-index:16;}
  #sel-bar.show{display:flex;}
  #sel-bar .sel-title{font-weight:700;font-size:12.5px;margin-bottom:4px;}
  #sel-bar #sel-close{margin-left:auto;flex:none;background:none;border:none;color:#8ea0b5;cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;}
  .sel-measures{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;}
  .sel-measures .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#a9b8c9;}
  .sel-measures .m b{color:#fff2df;font-weight:600;}
  #sel-bar .sel-title{font-size:15px;line-height:1.25;margin-bottom:8px;padding-right:4px;}
  .cotas{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:2px;}
  .cota{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .cota .cl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#a9b8c9;}
  .cota b{font-size:15px;font-weight:700;color:#fff;line-height:1.25;overflow-wrap:anywhere;}
  .cota em{font-style:normal;font-size:11px;font-weight:700;}
  .cota.loco.ok{border-color:rgba(74,196,120,.55);background:rgba(74,196,120,.12);} .cota.loco.ok em{color:#7fe0a3;}
  .cota.loco.dif{border-color:rgba(255,170,60,.6);background:rgba(255,170,60,.13);} .cota.loco.dif em{color:#ffc06a;}
  .cota.vazio{grid-column:1/-1;font-size:12px;color:#a9b8c9;}
  #sel-bar{min-width:min(340px,calc(100% - 24px));}
  .status-chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .sdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block;}
  .st-executado .sdot,.sdot.st-executado{background:var(--ok);}
  .st-pendente .sdot,.sdot.st-pendente{background:var(--warn);}
  .st-nao-conforme .sdot,.sdot.st-nao-conforme{background:var(--bad);}
  .st-none .sdot,.sdot.st-none{background:var(--none);}
  .status-chip.st-executado{background:rgba(46,204,113,0.16);color:#8beab0;}
  .status-chip.st-pendente{background:rgba(255,176,32,0.16);color:#ffcf80;}
  .status-chip.st-nao-conforme{background:rgba(255,90,90,0.16);color:#ffaaaa;}
  .status-chip.st-none{background:rgba(142,160,181,0.12);color:#a9b8c9;}

  /* ---- Etiquetas 3D e medição ---- */
  .tag{pointer-events:auto;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;line-height:1;padding:3px 6px;border-radius:5px;background:rgba(13,27,42,.86);color:#fff;white-space:nowrap;border-left:3px solid var(--none);transform:translateY(-14px);font-variant-numeric:tabular-nums;}
  .tag.st-executado{border-left-color:var(--ok);} .tag.st-pendente{border-left-color:var(--warn);} .tag.st-nao-conforme{border-left-color:var(--bad);}
  .tag.hit{outline:2px solid var(--accent);}
  .mtag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;text-align:center;line-height:1.25;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);}
  .mtag small{display:block;font-weight:500;font-size:9.5px;opacity:.9;}
  #hint{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;z-index:17;background:var(--text);color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;box-shadow:var(--shadow);max-width:min(420px,calc(100% - 150px));text-align:center;}
  #hint button{background:none;border:none;color:#ffcf80;font-weight:700;cursor:pointer;padding:0 0 0 8px;font-size:12px;}

  /* ---- Painel: busca + lista de tomadas ---- */
  #panel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:var(--panel);border-left:1px solid var(--border);box-shadow:var(--shadow);transition:transform .25s ease;display:flex;flex-direction:column;z-index:25;}
  #panel.closed{transform:translateX(105%);}
  .panel-handle{display:none;flex:none;justify-content:center;padding:9px 0 3px;cursor:pointer;background:none;border:none;width:100%;}
  .panel-handle span{width:40px;height:4px;border-radius:2px;background:var(--border);}
  .panel-head{flex:none;padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .panel-title{display:flex;align-items:center;justify-content:space-between;}
  .panel-title h2{font-family:"Archivo",sans-serif;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-dim);margin:0;}
  .panel-title button{background:none;border:none;font-size:20px;line-height:1;color:var(--text-dim);cursor:pointer;padding:2px 4px;}
  .search-wrap{position:relative;}
  .search-wrap input{width:100%;padding:9px 32px 9px 32px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;font-family:inherit;}
  .search-wrap input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-dim);fill:none;stroke-width:2;}
  .search-wrap .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--text-dim);cursor:pointer;padding:4px 8px;}
  .status-filter{display:flex;flex-wrap:wrap;gap:6px;}
  .sf-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .sf-btn .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  .sf-btn.active{border-color:var(--text);background:var(--text);color:#fff;}
  .panel-meta{font-size:11.5px;color:var(--text-dim);}
  .panel-body{flex:none;padding:6px 8px 14px;}
  #panel{overflow-y:auto;overscroll-behavior:contain;}
  .panel-head{position:relative;}
  .t-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;width:100%;padding:9px 8px;border:none;border-bottom:1px solid var(--panel-2);background:none;text-align:left;cursor:pointer;color:var(--text);}
  .t-row:hover{background:var(--panel-2);}
  .t-row.selected{background:var(--accent-soft);}
  .t-row .t-name{font-size:13px;font-weight:700;}
  .t-row .t-sub{grid-column:2 / 4;font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .t-row .t-h{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .empty-hint{padding:24px 10px;text-align:center;color:var(--text-dim);font-size:12.5px;line-height:1.6;}

  /* ---- Etapas de execução (marcadas no celular) ---- */
  .et-0{--et:#b9c3cf;} .et-1{--et:#ffb020;} .et-2{--et:#3b8fe0;} .et-3{--et:#9b6fe0;} .et-4{--et:#2ecc71;}
  .edot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--et,#b9c3cf);}
  .tag[class*="et-"]{border-left-color:var(--et);}
  .etapa-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .et-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#dfe9f5;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:38px;}
  .et-btn.done{background:rgba(255,255,255,.12);}
  .et-btn.on{background:var(--et);border-color:var(--et);color:#0d1b2a;}
  .et-btn.on .edot{background:#0d1b2a;}
  .et-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#a9b8c9;margin-top:6px;}
  .et-meta b{color:#fff2df;font-weight:600;}
  #sel-bar{max-height:62%;overflow-y:auto;}
  #tag-menu{position:absolute;left:66px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:18;background:rgba(19,28,40,0.96);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 12px;color:#eaf1f8;width:220px;box-shadow:var(--shadow);}
  #tag-menu .tm-h{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;margin-bottom:6px;}
  #tag-menu .tm-s{font-size:11px;color:#a9b8c9;margin:8px 0 4px;}
  #tag-menu label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;cursor:pointer;min-height:32px;}
  #tag-menu input{width:17px;height:17px;accent-color:#c9700f;}
  .tag .tl{display:block;} .tag .tl + .tl{margin-top:2px;opacity:.85;font-weight:500;font-size:9.5px;}
  .tag .tet{display:inline-flex;align-items:center;gap:4px;} .tag .tet i{width:6px;height:6px;border-radius:50%;background:var(--et);display:inline-block;}
  .mini-btn{display:block;margin-top:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#ffcf80;border-radius:7px;padding:7px 10px;font:600 11.5px "Public Sans",sans-serif;cursor:pointer;min-height:34px;}
  details.props{margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:6px;}
  details.props summary{cursor:pointer;font-size:11.5px;font-weight:600;color:#a9b8c9;padding:4px 0;}
  .props-h{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#ffcf80;margin:8px 0 2px;}
  .props-r{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;font-size:11.5px;padding:1px 0;}
  .props-r .k{color:#a9b8c9;overflow-wrap:anywhere;} .props-r .v{color:#eaf1f8;overflow-wrap:anywhere;}
  .star{background:none;border:none;color:#8ea0b5;font-size:16px;cursor:pointer;padding:2px;min-height:28px;}
  .star.on{color:#ffb020;} .star:disabled{cursor:default;opacity:.7;}
  .sync{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:6px 10px;white-space:nowrap;flex:none;cursor:pointer;}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--none);}
  .sync.ok i{background:var(--ok);} .sync.wait i{background:var(--warn);} .sync.off i{background:var(--bad);}
  .etapa-filter,.bulk{display:flex;flex-wrap:wrap;gap:6px;}
  .sf-btn.et-f.active{background:var(--et);border-color:var(--et);color:#0d1b2a;}
  .sf-btn.et-f.active .edot{background:#0d1b2a;}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:2px;}
  .seg button{border:none;background:none;padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .seg button.active{background:var(--text);color:#fff;}
  .row-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .who{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px;font-family:inherit;}
  .bulk-box{border:1px dashed var(--border);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;}
  .bulk-box .lbl{font-size:11.5px;color:var(--text-dim);}
  .bulk .sf-btn{padding:5px 9px;}
  .bulk-confirm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:600;}

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* Pavimentos e ambientes. Cada ambiente é um GLB exportado de uma vista 3D do
   Revit e comprimido (meshopt) na pasta modelos/. box = limites em planta
   [xmin, ymin, xmax, ymax] nas coordenadas do Revit (iguais em todos os arquivos),
   usados só para desenhar a planta-chave.
   Os boxes da planta-chave são os limites do GLB (m) convertidos para pés

const FLOORS = [

    { id:'garagem',    label:'Garagem',                    file:'modelos/garagem.glb',                mb:1.0, box:[-3.0,-38.4,17.4,-15.9], kp:'Garagem' },
    { id:'estar',      label:'Estar · Lounge',             file:'modelos/estar-lounge.glb',           mb:1.8, box:[16.3,-32.0,33.5,-2.0], kp:'Estar' },
    { id:'jantar',     label:'Jantar · Cozinha',           file:'modelos/jantar-cozinha.glb',         mb:2.4, box:[31.7,-34.6,51.5,-3.0], kp:'Jantar / Coz.' },
    { id:'gourmet',    label:'Gourmet · Serviço · I.S. · Brinquedoteca', file:'modelos/gourmet-servico-lazer.glb', mb:2.9, box:[49.6,-34.6,74.0,-3.0], kp:'Gourmet / Serv.' },
  ]},
  { id: 'pav1', label: 'Pavimento Superior', rooms: [
    { id:'pav1',       label:'Pavimento Superior inteiro', file:'modelos/pavimento-superior.glb',     mb:8.3, all:true, box:[-0.1,-31.3,70.9,0.1] },
    { id:'master',     label:'Suíte e Closet Master',      file:'modelos/suite-closet-master.glb',    mb:1.8, box:[-0.1,-25.5,17.2,0.1],  kp:'Master' },
    { id:'davi',       label:'Suíte Davi',                 file:'modelos/suite-davi.glb',             mb:1.6, box:[17.2,-21.7,32.3,-6.7], kp:'Davi' },
    { id:'bela',       label:'Suíte Bela',                 file:'modelos/suite-bela.glb',             mb:1.5, box:[32.3,-21.7,48.3,-7.0], kp:'Bela' },
    { id:'sara',       label:'Suíte Sara · Cinema',        file:'modelos/suite-sara-cinema.glb',      mb:3.1, box:[48.3,-31.3,70.9,-7.0], kp:'Sara / Cinema' },
    { id:'circulacao', label:'BHO Master · Circulação · Rouparia · Escada', file:'modelos/bho-circulacao-escada.glb', mb:2.9, box:[17.2,-31.3,48.3,-21.7], kp:'Circ. / Escada' },
  ]},
];
/* Campos do balão do ponto. Para mostrar outro parâmetro do Revit para todos,
   copie uma linha e troque "param" pelo nome exato que aparece em "Todas as
   propriedades" no app (maiúsculas e acentos não importam). formato:
   'distancia' mostra 0,40 como 40 cm. Campo vazio no Revit não aparece.
   Cada pessoa também pode fixar mais campos no próprio aparelho, tocando na
   estrela em "Todas as propriedades". */
/* Convenção da obra: Marca = tipo do ponto (tomada, luminária);
   Comentários = distância (ao ponto ao lado, à parede). A situação é a etapa
   marcada no celular. */
const CAMPOS = [
  { rotulo: 'Cota em projeto', param: 'Cota em Projeto' },
  { rotulo: 'Cota in loco',    param: 'Cota in loco' },
];
FLOORS.forEach((f) => f.rooms.forEach((r) => { r.floor = f; }));
const ALL_ROOMS = FLOORS.flatMap((f) => f.rooms);
let ROOMS = FLOORS[0].rooms;
const fmtMB = (v) => v.toFixed(1).replace('.', ',') + ' MB';
const $ = (id) => document.getElementById(id);

/* ---------------- Renderer / cena ---------------- */
const holder = $('canvas-holder');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('label-layer') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f6f8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.01; controls.maxDistance = 800; controls.zoomSpeed = 2.5;

scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x0a1524, 1.1));
const d1 = new THREE.DirectionalLight(0xffffff, 1.4); d1.position.set(12, 18, 8); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x6f9fd8, 0.5); d2.position.set(-14, 6, -10); scene.add(d2);
const grid = new THREE.GridHelper(200, 80, 0x9aa7b3, 0xd3d9de);
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

const modelGroup = new THREE.Group();   // modelo do ambiente
const overlayGroup = new THREE.Group(); // contornos, etiquetas, medição
scene.add(modelGroup, overlayGroup);

function resize(){
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* Etiquetas: com muitas tomadas na tela (pavimento inteiro), só mostra as
   que estão perto da câmera para não virar uma nuvem de texto. */
const tmpV = new THREE.Vector3();
function updateTagVisibility(){
  if (!tagsOn || measureOn) return;
  const crowded = tomadaClusters.length > 60;
  const limit = Math.max(6, fitSphere.radius * 0.45);
  tomadaClusters.forEach((c) => {
    if (!c.tag) return;
    let show = c.visible;
    if (show && crowded) show = camera.position.distanceTo(tmpV.copy(c.center).applyMatrix4(modelGroup.matrixWorld)) < limit;
    c.tag.visible = show;
  });
}

/* ---------------- Categorias e status ---------------- */
const CATEGORY_STYLE = {
  estrutura: { color: 0x9aa4b2, metalness: 0.85, roughness: 0.28, opacity: 0.3, label: 'Estrutura LSF' },
  conduite:  { color: 0xffd400, metalness: 0.05, roughness: 0.4, opacity: 1, label: 'Conduítes' },
  tomada:    { color: 0xf2efe8, metalness: 0.05, roughness: 0.35, opacity: 1, label: 'Pontos' },
  suporte:   { color: 0x5b8ac9, metalness: 0.5, roughness: 0.45, opacity: 1, label: 'Suportes' },
};
const CATEGORY_ORDER = ['estrutura', 'conduite', 'tomada', 'suporte'];
const mats = {};
function materialFor(cat){
  if (!mats[cat]) {
    const s = CATEGORY_STYLE[cat];
    mats[cat] = new THREE.MeshStandardMaterial({ color: s.color, metalness: s.metalness, roughness: s.roughness, transparent: s.opacity < 1, opacity: s.opacity });
  }
  return mats[cat];
}
/* Tomadas pintadas pela situação (propriedade Marca no Revit). */
const STATUS = {
  'nao-conforme': { label: 'Não conforme', color: 0xff5a5a, order: 0 },
  'pendente':     { label: 'Pendente',     color: 0xffb020, order: 1 },
  'none':         { label: 'Sem status',   color: 0xf2efe8, order: 2 },
  'executado':    { label: 'Executado',    color: 0x2ecc71, order: 3 },
};
const statusMats = {};
function statusMaterial(key){
  if (!statusMats[key]) statusMats[key] = new THREE.MeshStandardMaterial({ color: STATUS[key].color, metalness: 0.05, roughness: 0.4 });
  return statusMats[key];
}
/* Etapas de execução: marcadas no celular e salvas no banco (api/etapas.js).
   Cada etapa inclui as anteriores: um ponto "Acabamento" já passou por infra e
   enfiação. O ponto é identificado pelo ID do elemento no Revit. */
const OBRA = 'l14q13';
const ETAPAS = [
  { label: 'Não iniciado', curto: 'Não iniciado', color: 0xf2efe8 },
  { label: 'Infra (caixa e eletroduto)', curto: 'Infra', color: 0xffb020 },
  { label: 'Enfiação', curto: 'Enfiação', color: 0x3b8fe0 },
  { label: 'Acabamento', curto: 'Acabamento', color: 0x9b6fe0 },
  { label: 'Testado', curto: 'Testado', color: 0x2ecc71 },
];
const etapaMats = {};
function etapaMaterial(k){
  if (!etapaMats[k]) etapaMats[k] = new THREE.MeshStandardMaterial({ color: ETAPAS[k].color, metalness: 0.05, roughness: 0.4 });
  return etapaMats[k];
}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function categorize(p){
  const n = p.toLowerCase();
  if (/perfil.*lsf/.test(n)) return 'suporte';
  if (/conduite|eletroduto|caixa/.test(n)) return 'conduite';
  if (/tomada|interruptor|dispositivos de (ilumina|comunica|telefonia)/.test(n)) return 'tomada';
  return 'estrutura';
}

/* ---------------- Estado ---------------- */
let current = null;
let meshIndex = [], allMeshes = [], tomadaClusters = [], outlines = [];
let fitSphere = new THREE.Sphere(new THREE.Vector3(), 5);
let activeCats = new Set();
let statusFilter = 'all';
let etapaFilter = 'all';
let colorMode = 'etapa';   // situação = etapa marcada no celular
let etapaServer = {};                          // elemento -> { etapa, autor, em }
let fila = store.get('campo3d-fila', []);      // marcações ainda não enviadas
let syncState = 'wait', syncBusy = false;
let bulkPending = null;
let selectedCluster = null;
let tagsOn = store.get('campo3d-tags', false);   // etiquetas só se a pessoa ligar
const cache = new Map();       // id -> root já montado (troca instantânea ao voltar)
const downloaded = new Set();  // arquivos já baixados (cache offline)
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

const roomsEl = $('rooms'), titleEl = $('room-title');
const loadingEl = $('loading'), pctEl = $('load-pct'), barEl = $('load-bar'), errEl = $('load-error'), loadLabel = $('load-label');
const selBar = $('sel-bar'), selMeasures = $('sel-measures'), selTitle = $('sel-title');
const panel = $('panel'), searchInput = $('search'), listEl = $('t-list');

function frameToSphere(sphere, top){
  const r = Math.max(sphere.radius, 0.5);
  const dir = top ? new THREE.Vector3(0, 1, 0.0001) : new THREE.Vector3(0.85, 0.65, 1).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (top ? 1.0 : 1.15);
  camera.position.copy(sphere.center).add(dir.multiplyScalar(dist));
  camera.near = Math.max(r / 400, 0.005); camera.far = Math.max(r * 40, 100);
  camera.updateProjectionMatrix();
  controls.target.copy(sphere.center); controls.update();
}
function worldBox(box){ return box.clone().applyMatrix4(modelGroup.matrixWorld); }

/* ---------------- Pavimentos / abas ---------------- */
const lastRoomByFloor = {};
function renderFloors(){
  const el = $('floor-switch');
  el.innerHTML = '';
  FLOORS.forEach((f) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'floor-btn' + (current && current.floor === f ? ' active' : '');
    b.textContent = f.label;
    b.addEventListener('click', () => {
      if (current && current.floor === f) return;
      selectRoom(lastRoomByFloor[f.id] || f.rooms.find((r) => r.id === 'garagem') || f.rooms.find((r) => !r.all) || f.rooms[0]);
    });
    el.appendChild(b);
  });
}
function renderRooms(){
  roomsEl.innerHTML = '';
  roomsEl.hidden = ROOMS.length < 2;
  ROOMS.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'room-btn' + (r.all ? ' all' : '') + (current && current.id === r.id ? ' active' : '');
    b.innerHTML = '<span class="rn"></span><span class="rm"></span>';
    b.querySelector('.rn').textContent = r.label;
    const rm = b.querySelector('.rm');
    if (downloaded.has(r.file)) { const d = document.createElement('span'); d.className = 'off'; d.title = 'Já baixado: abre sem internet'; rm.appendChild(d); }
    rm.appendChild(document.createTextNode(fmtMB(r.mb)));
    b.addEventListener('click', () => selectRoom(r));
    roomsEl.appendChild(b);
  });
  const act = roomsEl.querySelector('.active');
  if (act) act.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
}

/* ---------------- Planta-chave ---------------- */
const NS = 'http://www.w3.org/2000/svg';
function renderKeyplan(){
  const svg = $('kp-svg');
  const whole = ROOMS.find((r) => r.all && r.box);
  $('keyplan').hidden = ROOMS.length < 2 || !whole;
  if ($('keyplan').hidden) return;
  const all = whole.box, pad = 1.5;
  svg.setAttribute('viewBox', (all[0]-pad) + ' ' + (-all[3]-pad) + ' ' + (all[2]-all[0]+2*pad) + ' ' + (all[3]-all[1]+2*pad));
  svg.innerHTML = '';
  const o = document.createElementNS(NS, 'rect');
  o.setAttribute('class', 'outline');
  o.setAttribute('x', all[0]); o.setAttribute('y', -all[3]); o.setAttribute('width', all[2]-all[0]); o.setAttribute('height', all[3]-all[1]);
  svg.appendChild(o);
  ROOMS.filter((r) => !r.all && r.box).forEach((r) => {
    const [x0, y0, x1, y1] = r.box;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('class', 'room' + (current && current.id === r.id ? ' active' : ''));
    rect.setAttribute('x', x0 + .3); rect.setAttribute('y', -y1 + .3);
    rect.setAttribute('width', x1 - x0 - .6); rect.setAttribute('height', y1 - y0 - .6);
    rect.setAttribute('rx', .8);
    rect.addEventListener('click', () => selectRoom(r));
    const t = document.createElementNS(NS, 'title'); t.textContent = r.label; rect.appendChild(t);
    svg.appendChild(rect);
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', (x0 + x1) / 2); tx.setAttribute('y', -(y0 + y1) / 2 + 1);
    tx.setAttribute('text-anchor', 'middle');
    tx.textContent = r.kp;
    svg.appendChild(tx);
  });
}
$('kp-head').addEventListener('click', () => {
  const kp = $('keyplan');
  kp.classList.toggle('min');
  $('kp-caret').textContent = kp.classList.contains('min') ? '+' : '−';
});

/* ---------------- Leitura das propriedades do Revit ---------------- */
function parseRevitNumber(raw){ return parseFloat(String(raw).trim().replace(/\./g, '').replace(',', '.')); }
function fmtDist(v){ if (!isFinite(v)) return '—'; return Math.abs(v) < 3 ? Math.round(v * 100) + ' cm' : v.toFixed(2).replace('.', ',') + ' m'; }
function normalizeStatus(raw){
  const s = (raw || '').trim().toLowerCase();
  if (!s) return null;
  if (/execut/.test(s)) return 'executado';
  if (/pendent/.test(s)) return 'pendente';
  if (/n[aã]o\s*conforme|reprov/.test(s)) return 'nao-conforme';
  return null;
}
function paramsOf(mesh){
  const ud = mesh.userData || {};
  return (ud.parameters && typeof ud.parameters === 'object') ? ud.parameters : ud;
}
/* Um ponto de tomada = conjunto (tem Elevação, Dimensões e a Marca de status)
   + módulos internos (Marca = numeração automática do Revit, ignorada). */
function describeCluster(c){
  let altura = '', alturaNum = NaN, comentario = '', status = null, dims = '', faixa = '', carga = '', id = '';
  c.entries.forEach((e) => {
    const p = paramsOf(e.mesh);
    Object.keys(p).forEach((k) => {
      const val = p[k];
      if (val === undefined || val === null || val === '') return;
      const key = k.toLowerCase();
      if (key === 'type dimensões' && val !== 'Não Listar' && !dims) dims = String(val);
      if (/^type[\s_]/i.test(k)) return;
      if (!altura && /altura|height|eleva[cç][aã]o do ponto|eleva[cç][aã]o$/.test(key)) { alturaNum = parseRevitNumber(val); altura = isFinite(alturaNum) ? fmtDist(alturaNum) : String(val); }
      if (!comentario && /coment|comment/.test(key)) comentario = String(val);
      if (!status && /^(marca|mark)$/.test(key)) status = normalizeStatus(String(val));
      if (!carga && /tipo d[ae] carga/.test(key)) carga = String(val).replace(/\s*\(.*\)/, '');
    });
    if (!faixa) faixa = ['Alta', 'Média', 'Baixa'].find((f) => p[f] === 'Sim') || '';
    const d = p['Type Dimensões'];
    if (!id && d && d !== 'Não Listar' && e.mesh.userData && e.mesh.userData.elementId) id = String(e.mesh.userData.elementId);
  });
  if (!id) { const w = c.entries.find((e) => e.mesh.userData && e.mesh.userData.elementId); if (w) id = String(w.mesh.userData.elementId); }
  const st = status || 'none';
  const sub = [dims, faixa && ('altura ' + faixa.toLowerCase()), carga].filter(Boolean).join(' · ');
  c.info = { altura, alturaNum, comentario, status: st, dims, faixa, carga, id, sub,
    name: id ? 'Ponto #' + id : 'Ponto',
    search: [id, altura, comentario, STATUS[st].label, dims, faixa, carga].join(' ').toLowerCase() };
  /* Propriedades de cada elemento do ponto (conjunto, módulos, caixa), o
     conjunto principal primeiro. Base do balão e de "Todas as propriedades". */
  const byEl = new Map();
  c.entries.forEach((e) => {
    const ud = e.mesh.userData || {};
    const key = ud.elementId ? String(ud.elementId) : e.mesh.uuid;
    if (!byEl.has(key)) byEl.set(key, { el: ud.elementId ? String(ud.elementId) : '', cat: ud.elementCategory || '', nome: e.name || '', params: paramsOf(e.mesh) });
  });
  c.props = [...byEl.values()].sort((a, b) => (b.el === id) - (a.el === id));
  c.info.marca = valorParam(c, 'Marca').replace(/''/g, '"');
  c.info.search += ' ' + [c.info.marca, ...camposDe(c).map((f) => f.valor)].join(' ').toLowerCase();
}

/* ---------------- Campos configuráveis ---------------- */
const RUIDO = /^(ifc|exportar|fase |recobrimento|type (tipo ifcguid|número omniclass|título omniclass|exportar|família|e-mail|url))/i;
const norm = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function valorParam(c, nome){
  const alvo = norm(nome);
  for (const pr of c.props || []) {
    for (const k of Object.keys(pr.params)) {
      if (norm(k) !== alvo) continue;
      const v = pr.params[k];
      if (v === undefined || v === null || v === '' || v === 'Não Listar') continue;
      if (alvo === 'marca' && (/^\d+$/.test(String(v)) || normalizeStatus(String(v)))) continue; // numeração dos módulos e status antigos
      return String(v);
    }
  }
  return '';
}
function formatar(v, formato){
  if (formato === 'distancia') { const n = parseRevitNumber(v); return isFinite(n) ? fmtDist(n) : v; }
  return v;
}
let favoritos = store.get('campo3d-campos', []);   // campos fixados neste aparelho
function camposDe(c){
  const lista = [...CAMPOS, ...favoritos.filter((f) => !CAMPOS.some((x) => norm(x.param) === norm(f))).map((f) => ({ rotulo: f.replace(/^Type /, ''), param: f, fav: true }))];
  return lista.map((f) => ({ ...f, valor: formatar(valorParam(c, f.param), f.formato) })).filter((f) => f.valor);
}

/* ---------------- Índice do modelo ---------------- */
function buildIndex(root){
  meshIndex = []; allMeshes = [];
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    if (!obj.geometry.attributes.normal) obj.geometry.computeVertexNormals();
    const path = [];
    let p = obj;
    while (p && p !== root) { if (p.name) path.unshift(p.name); p = p.parent; }
    const cat = categorize(path.join(' / ') || obj.name || '');
    obj.material = materialFor(cat);
    allMeshes.push(obj);
    meshIndex.push({ mesh: obj, name: obj.name || '', cat });
  });
  root.updateMatrixWorld(true);
  meshIndex.forEach((e) => { e.box = new THREE.Box3().setFromObject(e.mesh); e.center = e.box.getCenter(new THREE.Vector3()); e.pointGroup = null; });
  tomadaClusters = [];
  meshIndex.filter((e) => e.cat === 'tomada').forEach((e) => {
    let c = tomadaClusters.find((c) => Math.hypot(c.x - e.center.x, c.z - e.center.z) < 0.12);
    if (!c) { c = { entries: [], box: new THREE.Box3(), x: e.center.x, z: e.center.z, visible: true }; tomadaClusters.push(c); }
    c.entries.push(e); c.box.union(e.box);
  });
  tomadaClusters.forEach((c) => {
    c.center = c.box.getCenter(new THREE.Vector3());
    c.entries.forEach((e) => { e.pointGroup = c; });
    describeCluster(c);
    c.et = etapaDe(c.info.id);
    paintCluster(c);
  });
  /* A caixa 4x2 do ponto (conduíte) abre o mesmo balão do ponto. */
  meshIndex.forEach((e) => {
    if (e.pointGroup || !/caixa/i.test(e.name || '')) return;
    let best = null, bd = 0.2;
    tomadaClusters.forEach((c) => { const d = c.center.distanceTo(e.center); if (d < bd) { bd = d; best = c; } });
    if (best) e.pointGroup = best;
  });
  tomadaClusters.sort((a, b) => STATUS[a.info.status].order - STATUS[b.info.status].order || (a.info.alturaNum || 0) - (b.info.alturaNum || 0));
}
function paintCluster(c){
  const m = colorMode === 'etapa' ? etapaMaterial(c.et.etapa) : statusMaterial(c.info.status);
  c.entries.forEach((e) => { e.mesh.material = m; });
  if (c.tagEl) { c.tagEl.className = 'tag ' + (colorMode === 'etapa' ? 'et-' + c.et.etapa : 'st-' + c.info.status) + (c === selectedCluster ? ' hit' : ''); textoEtiqueta(c); }
}

/* ---------------- Conteúdo da etiqueta 3D ----------------
   Cada pessoa escolhe no menu das etiquetas o que aparece; fica salvo no aparelho. */
const ETIQ = [
  ['tipo', 'Tipo (Marca)'], ['altura', 'Altura'], ['distancia', 'Distância (Comentários)'],
  ['etapa', 'Etapa (infra, enfiação…)'], ['vizinho', 'Ponto vizinho (calculado)'], ['parede', 'Parede (estimada no modelo)'],
];
let tagFields = store.get('campo3d-etiqueta', ['tipo', 'altura', 'distancia', 'etapa']);
function textoEtiqueta(c){
  const el = c.tagEl; if (!el) return;
  const esc = (t) => String(t).replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
  const l1 = [], l2 = [];
  if (tagFields.includes('altura')) l1.push(c.info.altura || '?');
  if (tagFields.includes('tipo')) { const t = valorParam(c, 'Marca') || c.info.dims; if (t) l1.unshift(t.replace(/''/g, '"')); }
  if (tagFields.includes('distancia')) { const d = valorParam(c, 'Comentários'); if (d) l2.push(d); }
  if (tagFields.includes('vizinho') || tagFields.includes('parede')) {
    /* calculados pelo app */
    const pos = posDe(c, tagFields.includes('parede'));
    if (tagFields.includes('vizinho') && pos.viz != null) l2.push('viz ' + fmtDist(pos.viz));
    if (tagFields.includes('parede')) l2.push('par ' + (pos.parede == null ? '…' : isFinite(pos.parede) ? (pos.revit ? '' : '~') + fmtDist(pos.parede) : '—'));
  }
  let html = '<span class="tl">' + esc(l1.join(' · ') || c.info.name) + '</span>';
  if (l2.length) html += '<span class="tl">' + esc(l2.join(' · ')) + '</span>';
  if (tagFields.includes('etapa')) html += '<span class="tl tet et-' + c.et.etapa + '"><i></i>' + esc(ETAPAS[c.et.etapa].curto) + '</span>';
  el.innerHTML = html;
}
/* Posição calculada uma vez por ponto; a parede (raios no modelo) é calculada
   aos poucos, em segundo plano, para não travar o celular no pavimento inteiro. */
let filaParede = [];
function posDe(c, querParede){
  if (!c.pos) {
    let dv = Infinity, viz = null;
    tomadaClusters.forEach((o) => { if (o === c) return; const d = Math.hypot(o.center.x - c.center.x, o.center.z - c.center.z); if (d < dv) { dv = d; viz = o; } });
    c.pos = { viz: viz ? dv : null, vizC: viz, paredes: undefined, parede: null };
  }
  if (querParede && c.pos.paredes === undefined && !filaParede.includes(c)) { filaParede.push(c); agendarParedes(); }
  return c.pos;
}
/* Se o ponto tiver no Revit o parâmetro "Distância parede" (preenchido à mão
   ou por Dynamo), vale ele; senão o app estima pelo modelo (marcado com ~). */
function calcParede(c){
  const rv = parseRevitNumber(valorParam(c, 'Distância parede'));
  if (isFinite(rv)) { c.pos.paredes = [rv]; c.pos.parede = rv; c.pos.revit = true; return; }
  const par = distParedes(c);
  c.pos.paredes = par;
  c.pos.parede = par ? Math.min(...par) : Infinity;
  c.pos.revit = false;
}
let paredeTimer = null;
function agendarParedes(){
  if (paredeTimer) return;
  paredeTimer = setTimeout(function passo(){
    const t0 = performance.now();
    while (filaParede.length && performance.now() - t0 < 12) { const c = filaParede.shift(); if (tomadaClusters.includes(c)) { calcParede(c); textoEtiqueta(c); } }
    paredeTimer = filaParede.length ? setTimeout(passo, 16) : null;
  }, 50);
}
function renderTagMenu(){
  $('tag-on').checked = tagsOn;
  const el = $('tag-fields'); el.innerHTML = '';
  ETIQ.forEach(([k, label]) => {
    const l = document.createElement('label');
    const i = document.createElement('input'); i.type = 'checkbox'; i.checked = tagFields.includes(k);
    i.addEventListener('change', () => {
      tagFields = i.checked ? [...tagFields, k] : tagFields.filter((f) => f !== k);
      store.set('campo3d-etiqueta', tagFields);
      if (!tagsOn && i.checked) { tagsOn = true; $('tag-on').checked = true; applyTagState(); }
      tomadaClusters.forEach(textoEtiqueta);
    });
    l.append(i, document.createTextNode(label)); el.appendChild(l);
  });
}

/* ---------------- Etapas: estado, fila offline e sincronização ---------------- */
function etapaDe(id){
  const vazio = { etapa: 0, autor: '', em: '', local: false };
  if (!id) return vazio;
  for (let i = fila.length - 1; i >= 0; i--) if (fila[i].elemento === id) return { etapa: fila[i].etapa, autor: fila[i].autor, em: fila[i].em, local: true };
  const s = etapaServer[id];
  return s ? { etapa: s.etapa, autor: s.autor || '', em: s.em || '', local: false } : vazio;
}
function refreshEtapas(){
  tomadaClusters.forEach((c) => { c.et = etapaDe(c.info.id); paintCluster(c); });
  renderTomadaProgress(); renderEtapaFilter(); renderBulk();
  applyFilters(false);
  if (selectedCluster) renderSelEtapa(selectedCluster);
}
function marcar(clusters, etapa){
  const autor = (store.get('campo3d-nome', '') || '').trim() || 'Sem nome';
  const em = new Date().toISOString();
  clusters.forEach((c) => {
    if (!c.info.id) return;
    fila = fila.filter((f) => f.elemento !== c.info.id);
    fila.push({ elemento: c.info.id, etapa, autor, ambiente: current ? current.label : '', em });
  });
  store.set('campo3d-fila', fila);
  refreshEtapas();
  sincronizar();
}
function renderSync(){
  const el = $('sync');
  el.className = 'sync ' + syncState;
  const n = fila.length;
  $('sync-txt').textContent = n ? n + ' a enviar' : syncState === 'ok' ? 'Sincronizado' : syncState === 'off' ? 'Sem conexão' : 'Conectando…';
  el.title = n ? n + ' marcações salvas neste aparelho, aguardando internet para enviar.'
    : syncState === 'ok' ? 'Todas as marcações estão salvas no servidor.' : 'Sem contato com o servidor. As marcações ficam guardadas neste aparelho.';
}
async function sincronizar(){
  renderSync();
  if (syncBusy || !fila.length) return;
  syncBusy = true;
  const lote = fila.slice(0, 200);
  try {
    const r = await fetch('/api/etapas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ obra: OBRA, marcacoes: lote }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    lote.forEach((m) => { etapaServer[m.elemento] = { etapa: m.etapa, autor: m.autor, em: m.em }; });
    fila = fila.filter((f) => !lote.includes(f));
    store.set('campo3d-fila', fila);
    syncState = 'ok';
    refreshEtapas();
  } catch (e) { syncState = 'off'; }
  syncBusy = false;
  renderSync();
  if (fila.length && syncState === 'ok') sincronizar();
}
async function carregarEtapas(){
  try {
    const r = await fetch('/api/etapas?obra=' + OBRA, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    etapaServer = d.pontos || {};
    store.set('campo3d-etapas', etapaServer);
    syncState = 'ok';
  } catch (e) {
    etapaServer = store.get('campo3d-etapas', etapaServer);
    syncState = 'off';
  }
  renderSync();
  refreshEtapas();
  sincronizar();
}
etapaServer = store.get('campo3d-etapas', {});
window.addEventListener('online', carregarEtapas);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregarEtapas(); });
setInterval(() => { if (document.visibilityState === 'visible') carregarEtapas(); }, 60000);
$('sync').addEventListener('click', carregarEtapas);

/* ---------------- Etiquetas de altura ---------------- */
function buildTags(){
  tomadaClusters.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'tag st-' + c.info.status;
    c.tagEl = el;
    textoEtiqueta(c);
    el.title = c.info.name + ' · ' + STATUS[c.info.status].label;
    el.addEventListener('pointerdown', (ev) => ev.stopPropagation());
    el.addEventListener('click', (ev) => { ev.stopPropagation(); selectCluster(c, false); });
    const obj = new CSS2DObject(el);
    obj.position.set(c.center.x, c.box.max.y, c.center.z);
    c.tag = obj; c.tagEl = el;
    paintCluster(c);
    overlayGroup.add(obj);
  });
  applyTagState();
}
function applyTagState(){
  store.set('campo3d-tags', tagsOn);
  tomadaClusters.forEach((c) => { if (c.tag) c.tag.visible = tagsOn && !measureOn && c.visible; });
  $('btn-tags').classList.toggle('active', tagsOn);
}
$('btn-tags').addEventListener('click', () => { const m = $('tag-menu'); m.hidden = !m.hidden; if (!m.hidden) renderTagMenu(); });
$('tag-on').addEventListener('change', () => { tagsOn = $('tag-on').checked; applyTagState(); });
$('stage').addEventListener('pointerdown', (e) => { if (!e.target.closest('#tag-menu') && !e.target.closest('#btn-tags')) $('tag-menu').hidden = true; });

/* ---------------- Progresso ---------------- */
function counts(){
  const c = { all: tomadaClusters.length, executado: 0, pendente: 0, 'nao-conforme': 0, none: 0 };
  tomadaClusters.forEach((t) => { c[t.info.status]++; });
  return c;
}
function etapaCounts(){
  const n = [0, 0, 0, 0, 0];
  tomadaClusters.forEach((t) => { n[t.et ? t.et.etapa : 0]++; });
  return n;
}
function renderTomadaProgress(){
  const el = $('tomada-progress');
  const c = counts();
  if (!c.all) { el.hidden = true; return; }
  /* Avanço por etapa: % de pontos que já chegaram a cada etapa (ou passaram dela). */
  const n = etapaCounts();
  const ate = (k) => n.slice(k).reduce((a, b) => a + b, 0);
  const pct = (k) => Math.round(ate(k) / c.all * 100);
  $('tp-track').innerHTML = [4, 3, 2, 1].map((k) => '<i class="et-' + k + '" style="width:' + (n[k] / c.all * 100) + '%;background:var(--et)"></i>').join('');
  $('tp-text').innerHTML = '<b>Infra ' + pct(1) + '%</b> · ' + c.all + ' pontos' + '<span class="tp-2">' + (current.all ? '' : ' no ambiente') +
    '<br>Enf. ' + pct(2) + '% · Acab. ' + pct(3) + '% · Teste ' + pct(4) + '%' + (c['nao-conforme'] ? ' &nbsp;<span class="tp-nc">' + c['nao-conforme'] + ' n/c</span>' : '') + '</span>';
  /* Tomadas na divisa entre ambientes saem em mais de um arquivo; por isso o
     total oficial do pavimento é o da aba "inteiro", não a soma das abas. */
  el.title = current.all
    ? 'Total oficial do pavimento. Toque para ver a lista.'
    : 'Tomadas visíveis neste ambiente (as da divisa aparecem nos dois lados). O total oficial está na aba ' + current.floor.rooms.find((r) => r.all).label + '. Toque para ver a lista.';
  el.hidden = false;
}
$('tomada-progress').addEventListener('click', () => openPanel(true));

/* ---------------- Filtros: categoria, status e busca ---------------- */
/* Contagem de caixas do ambiente (elementos únicos do Revit), no lugar das
   categorias: caixa octogonal (teto) e caixa 4x2 (parede). */
function renderCategoryFilters(){
  const el = $('cat-filters');
  el.innerHTML = '';
  activeCats.clear();
  const octo = new Set(), c42 = new Set();
  meshIndex.forEach((m) => {
    const nome = m.name || '';
    if (!/caixa/i.test(nome)) return;
    const id = (m.mesh.userData && m.mesh.userData.elementId) || m.mesh.uuid;
    if (/octogonal/i.test(nome)) octo.add(id);
    else if (/4\s*x\s*2/i.test(nome)) c42.add(id);
  });
  [['Caixa octogonal', octo.size], ['Caixa 4x2', c42.size]].forEach(([rot, n]) => {
    const d = document.createElement('div');
    d.className = 'cat-chip cx-chip';
    d.innerHTML = '<span class="swatch" style="background:#ffd400"></span>' + rot + '<span class="n">' + n + '</span>';
    el.appendChild(d);
  });
}
function renderStatusFilter(){
  const el = $('status-filter');
  /* A situação agora é a etapa marcada no celular; a Marca virou o tipo do
     ponto. O filtro antigo por Marca fica desligado. */
  el.hidden = true; statusFilter = 'all'; return;
  el.innerHTML = '';
  const c = counts();
  [['all', 'Todas'], ['pendente'], ['executado'], ['nao-conforme'], ['none']].forEach(([key, label]) => {
    if (key !== 'all' && !c[key]) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sf-btn st-' + key + (statusFilter === key ? ' active' : '');
    b.innerHTML = (key === 'all' ? '' : '<span class="sdot"></span>') + (label || STATUS[key].label) + ' <span class="n">' + c[key] + '</span>';
    b.addEventListener('click', () => { statusFilter = key; renderStatusFilter(); applyFilters(true); });
    el.appendChild(b);
  });
}
function renderEtapaFilter(){
  const el = $('etapa-filter');
  el.innerHTML = '';
  const n = etapaCounts();
  if (!tomadaClusters.length) return;
  [['all', 'Todas etapas'], ...ETAPAS.map((e, k) => [k, e.curto])].forEach(([key, label]) => {
    if (key !== 'all' && !n[key]) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sf-btn et-f' + (key === 'all' ? '' : ' et-' + key) + (etapaFilter === key ? ' active' : '');
    b.innerHTML = (key === 'all' ? '' : '<span class="edot"></span>') + label + ' <span class="n">' + (key === 'all' ? tomadaClusters.length : n[key]) + '</span>';
    b.addEventListener('click', () => { etapaFilter = key; bulkPending = null; renderEtapaFilter(); renderBulk(); applyFilters(true); });
    el.appendChild(b);
  });
}
function clusterMatches(c, q){
  const et = c.et ? c.et.etapa : 0;
  return (statusFilter === 'all' || c.info.status === statusFilter) && (etapaFilter === 'all' || et === etapaFilter) &&
    (!q || c.info.search.includes(q) || c.info.name.toLowerCase().includes(q) || ETAPAS[et].label.toLowerCase().includes(q));
}
function listedClusters(){
  const q = searchInput.value.trim().toLowerCase();
  const tomadasOff = activeCats.size > 0 && !activeCats.has('tomada');
  return tomadasOff ? [] : tomadaClusters.filter((c) => clusterMatches(c, q));
}

/* Marcar em lote: todos os pontos da lista atual (depois dos filtros). Pede
   confirmação na própria tela, sem janela do navegador. */
function renderBulk(){
  const box = $('bulk-box'), el = $('bulk');
  const all = listedClusters().filter((c) => c.info.id);
  box.hidden = !all.length;
  el.innerHTML = '';
  if (!all.length) return;
  if (bulkPending !== null) {
    /* Em lote só avança: pontos que já passaram dessa etapa não voltam. */
    const items = all.filter((c) => c.et.etapa < bulkPending);
    $('bulk-lbl').textContent = '';
    const w = document.createElement('div');
    w.className = 'bulk-confirm';
    w.appendChild(document.createTextNode(items.length
      ? 'Avançar ' + items.length + (items.length === 1 ? ' ponto' : ' pontos') + ' para ' + ETAPAS[bulkPending].curto + '?' + (all.length > items.length ? ' (' + (all.length - items.length) + ' já estão nessa etapa ou além)' : '')
      : 'Todos os pontos da lista já estão em ' + ETAPAS[bulkPending].curto + ' ou além.'));
    const yes = document.createElement('button'); yes.type = 'button'; yes.className = 'yes'; yes.textContent = 'Confirmar';
    const no = document.createElement('button'); no.type = 'button'; no.textContent = 'Cancelar';
    yes.addEventListener('click', () => { const k = bulkPending; bulkPending = null; marcar(items, k); });
    no.addEventListener('click', () => { bulkPending = null; renderBulk(); });
    if (items.length) w.append(yes, no); else { no.textContent = 'Ok'; w.append(no); }
    el.appendChild(w);
    return;
  }
  $('bulk-lbl').textContent = 'Avançar os ' + all.length + ' pontos da lista para:';
  ETAPAS.forEach((e, k) => {

/* ---------------- Posição do ponto ----------------
   Ponto vizinho: o mais próximo em planta, pelo centro. Paredes transversais:
   acha a direção da parede pela guia do LSF mais próxima e mede, pelos dois
   lados, até a primeira peça da estrutura que cruza o caminho, a 15 cm da face.
   É medida no aço (sem placa) e só funciona com paredes alinhadas aos eixos
   do Revit; quando não dá para medir, o app diz. */
const rc2 = new THREE.Raycaster();
function direcaoParede(p, estrut){
  let dir = null, best = Infinity;
  estrut.forEach((e) => {
    const b = e.box, sx = b.max.x - b.min.x, sy = b.max.y - b.min.y, sz = b.max.z - b.min.z;
    if (Math.max(sx, sz) < 0.8 || Math.min(sx, sz) > 0.2 || sy > 0.3) return;   // só guias horizontais
    const aoLongoX = sx > sz;
    const dentro = aoLongoX ? p.x > b.min.x - 0.1 && p.x < b.max.x + 0.1 : p.z > b.min.z - 0.1 && p.z < b.max.z + 0.1;
    if (!dentro) return;
    const d = aoLongoX ? Math.abs(p.z - (b.min.z + b.max.z) / 2) : Math.abs(p.x - (b.min.x + b.max.x) / 2);
    if (d < best) { best = d; dir = aoLongoX ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1); }
  });
  return best <= 0.3 ? dir : null;
}
function distParedes(c){
  const estrut = meshIndex.filter((e) => e.cat === 'estrutura' || e.cat === 'suporte');
  if (!estrut.length) return null;
  const p = c.center.clone();
  const dir = direcaoParede(p, estrut);
  if (!dir) return null;
  const n = new THREE.Vector3(dir.z, 0, -dir.x);
  const alvos = estrut.map((e) => e.mesh);
  return [dir, dir.clone().negate()].map((d) => {
    let m = Infinity;
    [0.15, -0.15].forEach((off) => {
      rc2.set(p.clone().addScaledVector(n, off), d);
      rc2.far = 8;
      const hit = rc2.intersectObjects(alvos, false).find((h) => h.distance > 0.03);
      if (hit) m = Math.min(m, hit.distance);
    });
    return m;
  });
}

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;

  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(allMeshes.filter((m) => m.visible), false);
  if (measureOn) { if (hits.length) addMeasurePoint(hits[0].point); return; }
  if (hits.length) selectMesh(hits[0].object); else clearSelection();

  const requested = room.id;

    /* Todos os arquivos usam a mesma origem do Revit; centralizamos cada um
       para a câmera orbitar em volta do ambiente. */
    const c = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
    root.position.sub(c);

    showRoot(room, root);
    schedulePrefetch();
  }, (evt) => {
    if (!evt.total || !current || current.id !== requested) return;
    const p = Math.min(100, Math.round(evt.loaded / evt.total * 100));
    pctEl.textContent = p + '%'; barEl.style.width = p + '%';

      : 'Não foi possível abrir ' + room.label + '. Verifique a conexão e toque na aba de novo.';
    current = null; renderFloors(); renderRooms();
  });

/* ---------------- Abrir mais rápido: pré-download + offline ----------------
   Depois que o ambiente atual abre, os outros arquivos são baixados em segundo
   plano, um por vez (o service worker guarda para uso sem internet). Quem está
   com "economia de dados" ligada no celular não recebe o pré-download. */
let prefetching = false;
function schedulePrefetch(){
  if (prefetching || (navigator.connection && navigator.connection.saveData)) return;
  prefetching = true;
  const queue = [...(current ? current.floor.rooms : []), ...ALL_ROOMS].filter((r, i, a) => a.indexOf(r) === i && !downloaded.has(r.file));
  const next = () => {
    const r = queue.shift();
    if (!r) { prefetching = false; return; }
    if (downloaded.has(r.file)) { next(); return; }
    fetch(r.file).then((res) => res.ok ? res.arrayBuffer() : null).then((buf) => {
      if (buf) { downloaded.add(r.file); renderRooms(); }
    }).catch(() => {}).finally(() => setTimeout(next, 300));
  };
  setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(next) : next()), 1500);
}
async function checkOfflineCache(){
  try {
    if (!('caches' in window)) return;
    const c = await caches.open('campo3d-modelos');
    await Promise.all(ALL_ROOMS.map(async (r) => { if (await c.match(new URL(r.file, location.href).href)) downloaded.add(r.file); }));
    renderRooms();
  } catch (e) {}
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (ev) => {
    if (ev.data && ev.data.type === 'model-updated') {
      showHint('Modelo atualizado no Revit.<button id="hint-reload" type="button">Recarregar</button>');
      $('hint-reload').addEventListener('click', () => location.reload());
    }
  });
}

   inteiro logo de cara. #id no link abre outro ambiente (ex.: #jantar). */
(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  updateTagVisibility();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
checkOfflineCache();
renderSync();
carregarEtapas();
const fromHash = ALL_ROOMS.find((r) => '#' + r.id === location.hash);
selectRoom(fromHash || ALL_ROOMS.find((r) => r.id === 'garagem'));
</script>
