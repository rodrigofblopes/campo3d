<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Térreo por Ambientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#eef2f6;--panel:#ffffff;--panel-2:#f5f7fa;--text:#0d1b2a;--text-dim:#52657a;
    --border:#cdd8e3;--accent:#c9700f;--accent-ink:#fff7ec;--accent-soft:rgba(201,112,15,.14);--viewport:#f4f6f8;
    --overlay:rgba(19,28,40,0.86);--overlay-ink:#dfe9f5;--overlay-dim:#8ea0b5;
    --shadow:0 8px 24px -8px rgba(13,27,42,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}

  .topbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);z-index:20;}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .brand .mark{font-family:"Archivo",sans-serif;font-weight:800;font-size:11px;letter-spacing:.07em;color:var(--accent);white-space:nowrap;text-transform:uppercase;}
  .brand h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;}

  .floor-switch{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:3px;flex:none;}
  .floor-btn{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-family:"Public Sans",sans-serif;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .floor-btn.active{background:var(--text);color:#fff;}
  .floor-btn:disabled{cursor:default;opacity:.5;}
  .floor-btn .soon{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;margin-left:5px;}

  .topbar-spacer{flex:1;}
  .tomada-progress{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:6px 11px;flex:none;}
  .tomada-progress .tp-track{width:64px;height:6px;border-radius:3px;background:rgba(255,176,32,.25);overflow:hidden;flex:none;}
  .tomada-progress .tp-fill{height:100%;width:0%;background:#2ecc71;transition:width .2s ease;}
  .tomada-progress .tp-text{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.3;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tomada-progress .tp-text b{color:var(--text);font-weight:700;font-size:12px;}
  .tp-exec{color:#1f9d57;font-weight:600;}
  .tp-pend{color:#b86f00;font-weight:600;}
  .tp-nc{color:#d13b3b;font-weight:600;}

  /* ---- Abas de ambiente ---- */
  .rooms{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;background:var(--panel);border-bottom:1px solid var(--border);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .rooms::-webkit-scrollbar{display:none;}
  .room-btn{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:7px 12px 6px;cursor:pointer;
    font-family:"Public Sans",sans-serif;color:var(--text);text-align:left;}
  .room-btn .rn{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .room-btn .rm{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .room-btn.all{border-style:dashed;}
  .room-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .room-btn.active .rm{color:var(--accent-ink);opacity:.85;}
  .room-btn:focus-visible,.floor-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .stage{position:relative;flex:1;min-height:0;background:var(--viewport);}
  #canvas-holder{position:absolute;inset:0;}
  #canvas-holder canvas{display:block;width:100%;height:100%;touch-action:none;}

  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(244,246,248,.92);color:var(--text);font-family:"IBM Plex Mono",monospace;z-index:30;transition:opacity .3s ease;}
  #loading .mono-label{font-size:11.5px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;text-align:center;}
  #loading .pct{font-family:"Archivo",sans-serif;font-weight:800;font-size:32px;}
  .bar-track{width:200px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:var(--accent);transition:width .15s ease;}
  #loading.hide{opacity:0;pointer-events:none;}
  #load-error{display:none;color:#c0392b;font-size:12px;max-width:280px;text-align:center;line-height:1.5;}
  #load-time{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-dim);background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums;}

  /* ---- Planta-chave ---- */
  #keyplan{position:absolute;left:12px;top:12px;z-index:15;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px 8px 8px;color:var(--overlay-ink);}
  #keyplan .kp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;color:var(--overlay-dim);cursor:pointer;padding:0 0 5px;width:100%;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;}
  #keyplan.min .kp-head{padding:0;}
  #keyplan.min svg.kp{display:none;}
  #keyplan svg.kp{display:block;width:176px;height:auto;}
  .kp rect.room{fill:rgba(255,255,255,.06);stroke:rgba(223,233,245,.45);stroke-width:.35;cursor:pointer;transition:fill .15s;}
  .kp rect.room:hover{fill:rgba(255,255,255,.14);}
  .kp rect.room.active{fill:rgba(201,112,15,.55);stroke:#ffb35c;stroke-width:.6;}
  .kp rect.outline{fill:none;stroke:rgba(223,233,245,.25);stroke-width:.3;stroke-dasharray:1 1;}
  .kp text{fill:#dfe9f5;font-family:"Public Sans",sans-serif;font-size:2.6px;font-weight:700;pointer-events:none;}

  .toolbar{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:var(--overlay);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px;z-index:15;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;flex:none;}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .toolbar .icon-btn{background:transparent;border:1px solid transparent;color:var(--overlay-ink);}
  .toolbar .icon-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .toolbar hr{width:100%;border:none;border-top:1px solid rgba(255,255,255,0.12);margin:2px 0;}

  #sel-bar{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 150px));background:rgba(19,28,40,0.92);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:9px 12px;color:#eaf1f8;display:none;align-items:flex-start;gap:10px;z-index:16;}
  #sel-bar.show{display:flex;}
  #sel-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px;}
  #sel-bar button{margin-left:auto;flex:none;background:none;border:none;color:#8ea0b5;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .sel-measures{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;}
  .sel-measures .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#a9b8c9;}
  .sel-measures .m b{color:#fff2df;font-weight:600;}
  .status-chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .status-chip .sdot{width:6px;height:6px;border-radius:50%;flex:none;}
  .status-executado{background:rgba(46,204,113,0.16);color:#8beab0;} .status-executado .sdot{background:#2ecc71;}
  .status-pendente{background:rgba(255,176,32,0.16);color:#ffcf80;} .status-pendente .sdot{background:#ffb020;}
  .status-nao-conforme{background:rgba(255,90,90,0.16);color:#ffaaaa;} .status-nao-conforme .sdot{background:#ff5a5a;}
  .status-outro{background:rgba(142,160,181,0.16);color:#c7d3e0;} .status-outro .sdot{background:#8ea0b5;}
  .status-none{background:rgba(142,160,181,0.1);color:#8ea0b5;} .status-none .sdot{background:#54637a;}

  .cat-toggle{position:absolute;right:12px;top:12px;z-index:15;display:flex;flex-direction:column;gap:5px;}
  .cat-chip{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);background:var(--overlay);border-radius:999px;padding:6px 11px;font-family:"Public Sans",sans-serif;font-size:11.5px;font-weight:600;color:var(--overlay-dim);cursor:pointer;justify-content:flex-start;}
  .cat-chip .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-chip.active{color:#fff;border-color:var(--accent);}
  .cat-chip .n{font-family:"IBM Plex Mono",monospace;opacity:.8;margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums;}

  @media (max-width:640px){
    .brand h1{font-size:14px;}
    .icon-btn{width:42px;height:42px;}
    .icon-btn svg{width:20px;height:20px;}
    .floor-btn{padding:7px 11px;}
    .tomada-progress .tp-track{width:44px;}
    #keyplan svg.kp{width:148px;}
    .cat-chip{padding:7px 11px;font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">Obra &mdash; Fábio e Brunielly (L14Q13)<span class="badge">Prévia</span></span>
      <h1 id="room-title">Térreo</h1>
    </div>
    <div class="floor-switch">
      <button class="floor-btn active" type="button">Térreo</button>
      <button class="floor-btn" type="button" disabled>Pav. Superior<span class="soon">fora da prévia</span></button>
    </div>
    <div class="topbar-spacer"></div>
    <div class="tomada-progress" id="tomada-progress" hidden>
      <div class="tp-track"><div class="tp-fill" id="tp-fill"></div></div>
      <div class="tp-text" id="tp-text">&mdash;</div>
    </div>
  </div>
  <nav class="rooms" id="rooms" aria-label="Ambientes do térreo"></nav>

  <div class="stage">
    <div id="canvas-holder"></div>

    <div id="keyplan">
      <button class="kp-head" id="kp-head" type="button"><span>Planta-chave</span><span id="kp-caret">&minus;</span></button>
      <svg class="kp" id="kp-svg" aria-label="Planta-chave do térreo"></svg>
    </div>

    <div class="cat-toggle" id="cat-filters"></div>

    <div id="loading">
      <div class="mono-label" id="load-label">Carregando</div>
      <div class="pct" id="load-pct">0%</div>
      <div class="bar-track"><div class="bar-fill" id="load-bar"></div></div>
      <div id="load-error"></div>
    </div>
    <div id="load-time" hidden></div>

    <div class="toolbar">
      <button class="icon-btn" id="btn-reset" type="button" title="Enquadrar ambiente">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      </button>
      <button class="icon-btn" id="btn-top" type="button" title="Vista de cima">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h9M13 4v16"/></svg>
      </button>
      <hr>
      <button class="icon-btn" id="btn-full" type="button" title="Tela cheia">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <div id="sel-bar">
      <span class="dot"></span>
      <div class="sel-measures" id="sel-measures"></div>
      <button id="sel-close" type="button" title="Fechar">&times;</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* Ambientes do térreo: cada um é um GLB exportado de uma vista 3D do Revit.
   box = limites em planta [xmin, ymin, xmax, ymax] nas coordenadas do Revit
   (mesmo sistema para todos os arquivos), usados só para desenhar a planta-chave. */
const ROOMS = [
  { id:'terreo',     label:'Térreo inteiro',               file:'modelos/terreo-completo.glb',        mb:6.3, orig:21.8, all:true, box:[-3.0,-38.4,74.0,2.0] },
  { id:'escritorio', label:'Escritório · Lavabo · Hall',   file:'modelos/escritorio-lavabo-hall.glb', mb:1.2, orig:4.6, box:[-3.0,-16.6,17.0,2.0],  kp:'Escrit. / Hall' },
  { id:'garagem',    label:'Garagem',                      file:'modelos/garagem.glb',                mb:1.2, orig:4.0, box:[-3.0,-38.4,17.4,-15.9], kp:'Garagem' },
  { id:'estar',      label:'Estar · Lounge',               file:'modelos/estar-lounge.glb',           mb:1.3, orig:4.6, box:[16.3,-32.0,33.5,-2.0], kp:'Estar' },
  { id:'jantar',     label:'Jantar · Cozinha',             file:'modelos/jantar-cozinha.glb',         mb:1.8, orig:5.9, box:[31.7,-34.6,51.5,-3.0], kp:'Jantar / Coz.' },
  { id:'gourmet',    label:'Gourmet · Serviço · I.S. · Brinquedoteca', file:'modelos/gourmet-servico-lazer.glb', mb:2.6, orig:8.4, box:[49.6,-34.6,74.0,-3.0], kp:'Gourmet / Serv.' },
];
const fmtMB = (v) => v.toFixed(1).replace('.', ',') + ' MB';

/* ---------------- Renderer / cena ---------------- */
const holder = document.getElementById('canvas-holder');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f6f8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.01; controls.maxDistance = 800; controls.zoomSpeed = 2.5;

scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x0a1524, 1.1));
const d1 = new THREE.DirectionalLight(0xffffff, 1.4); d1.position.set(12, 18, 8); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x6f9fd8, 0.5); d2.position.set(-14, 6, -10); scene.add(d2);
const grid = new THREE.GridHelper(200, 80, 0x9aa7b3, 0xd3d9de);
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

const modelGroup = new THREE.Group();
scene.add(modelGroup);

function resize(){
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

/* ---------------- Categorias (mesma regra do visualizador atual) ---------------- */
const CATEGORY_STYLE = {
  estrutura: { color: 0x9aa4b2, metalness: 0.85, roughness: 0.28, opacity: 0.3, label: 'Estrutura LSF' },
  conduite:  { color: 0xffd400, metalness: 0.05, roughness: 0.4, opacity: 1, label: 'Conduítes' },
  tomada:    { color: 0xf2efe8, metalness: 0.05, roughness: 0.35, opacity: 1, label: 'Tomadas' },
  suporte:   { color: 0x5b8ac9, metalness: 0.5, roughness: 0.45, opacity: 1, label: 'Suportes' },
};
const CATEGORY_ORDER = ['estrutura', 'conduite', 'tomada', 'suporte'];
const mats = {};
function materialFor(cat){
  if (!mats[cat]) {
    const s = CATEGORY_STYLE[cat];
    mats[cat] = new THREE.MeshStandardMaterial({ color: s.color, metalness: s.metalness, roughness: s.roughness, transparent: s.opacity < 1, opacity: s.opacity });
  }
  return mats[cat];
}
function categorize(p){
  const n = p.toLowerCase();
  if (/perfil.*lsf/.test(n)) return 'suporte';
  if (/conduite|eletroduto|caixa/.test(n)) return 'conduite';
  if (/tomada/.test(n)) return 'tomada';
  return 'estrutura';
}

/* ---------------- Estado ---------------- */
let current = null;
let meshIndex = [], allMeshes = [], tomadaClusters = [], outlines = [];
let fitSphere = new THREE.Sphere(new THREE.Vector3(), 5);
let activeCats = new Set();
const cache = new Map();   // id -> root já carregado (troca instantânea ao voltar)
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

const $ = (id) => document.getElementById(id);
const roomsEl = $('rooms'), titleEl = $('room-title');
const loadingEl = $('loading'), pctEl = $('load-pct'), barEl = $('load-bar'), errEl = $('load-error'), loadLabel = $('load-label'), loadTime = $('load-time');
const selBar = $('sel-bar'), selMeasures = $('sel-measures');

function frameToSphere(sphere, top){
  const r = Math.max(sphere.radius, 0.5);
  const dir = top ? new THREE.Vector3(0, 1, 0.0001) : new THREE.Vector3(0.85, 0.65, 1).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (top ? 1.0 : 1.15);
  camera.position.copy(sphere.center).add(dir.multiplyScalar(dist));
  camera.near = Math.max(r / 200, 0.01); camera.far = Math.max(r * 40, 100);
  camera.updateProjectionMatrix();
  controls.target.copy(sphere.center); controls.update();
}

/* ---------------- Abas ---------------- */
function renderRooms(){
  roomsEl.innerHTML = '';
  ROOMS.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.id = 'room-' + r.id;
    b.className = 'room-btn' + (r.all ? ' all' : '') + (current && current.id === r.id ? ' active' : '');
    b.innerHTML = '<span class="rn"></span><span class="rm"></span>';
    b.querySelector('.rn').textContent = r.label;
    b.querySelector('.rm').textContent = fmtMB(r.mb) + (cache.has(r.id) ? ' · carregado' : '');
    b.addEventListener('click', () => selectRoom(r));
    roomsEl.appendChild(b);
  });
  const act = roomsEl.querySelector('.active');
  if (act) act.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
}

/* ---------------- Planta-chave ---------------- */
const NS = 'http://www.w3.org/2000/svg';
function renderKeyplan(){
  const svg = $('kp-svg');
  const all = ROOMS.find((r) => r.all).box;
  const pad = 1.5;
  // Planta vista de cima: x do Revit -> direita; y do Revit -> para cima.
  svg.setAttribute('viewBox', (all[0]-pad) + ' ' + (-all[3]-pad) + ' ' + (all[2]-all[0]+2*pad) + ' ' + (all[3]-all[1]+2*pad));
  svg.innerHTML = '';
  const o = document.createElementNS(NS, 'rect');
  o.setAttribute('class', 'outline');
  o.setAttribute('x', all[0]); o.setAttribute('y', -all[3]); o.setAttribute('width', all[2]-all[0]); o.setAttribute('height', all[3]-all[1]);
  svg.appendChild(o);
  ROOMS.filter((r) => !r.all).forEach((r) => {
    const [x0, y0, x1, y1] = r.box;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('class', 'room' + (current && current.id === r.id ? ' active' : ''));
    rect.setAttribute('x', x0 + .3); rect.setAttribute('y', -y1 + .3);
    rect.setAttribute('width', x1 - x0 - .6); rect.setAttribute('height', y1 - y0 - .6);
    rect.setAttribute('rx', .8);
    rect.addEventListener('click', () => selectRoom(r));
    const t = document.createElementNS(NS, 'title'); t.textContent = r.label; rect.appendChild(t);
    svg.appendChild(rect);
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', (x0 + x1) / 2); tx.setAttribute('y', -(y0 + y1) / 2 + 1);
    tx.setAttribute('text-anchor', 'middle');
    tx.textContent = r.kp;
    svg.appendChild(tx);
  });
}
$('kp-head').addEventListener('click', () => {
  const kp = $('keyplan');
  kp.classList.toggle('min');
  $('kp-caret').textContent = kp.classList.contains('min') ? '+' : '−';
});

/* ---------------- Índice / tomadas ---------------- */
function buildIndex(root){
  meshIndex = []; allMeshes = [];
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    if (!obj.geometry.attributes.normal) obj.geometry.computeVertexNormals();
    const path = [];
    let p = obj;
    while (p && p !== root) { if (p.name) path.unshift(p.name); p = p.parent; }
    const full = path.join(' / ');
    const cat = categorize(full || obj.name || '');
    obj.material = materialFor(cat);
    allMeshes.push(obj);
    meshIndex.push({ mesh: obj, name: obj.name || '', path: full, cat });
  });
  meshIndex.forEach((e) => { e.box = new THREE.Box3().setFromObject(e.mesh); e.center = e.box.getCenter(new THREE.Vector3()); e.pointGroup = null; });
  tomadaClusters = [];
  meshIndex.filter((e) => e.cat === 'tomada').forEach((e) => {
    let c = tomadaClusters.find((c) => Math.hypot(c.x - e.center.x, c.z - e.center.z) < 0.12);
    if (!c) { c = { entries: [], box: new THREE.Box3(), x: e.center.x, z: e.center.z }; tomadaClusters.push(c); }
    c.entries.push(e); c.box.union(e.box);
  });
  tomadaClusters.forEach((c) => c.entries.forEach((e) => { e.pointGroup = c; }));
}

function parseRevitNumber(raw){ return parseFloat(String(raw).trim().replace(/\./g, '').replace(',', '.')); }
function fmtDist(v){ if (!isFinite(v)) return '—'; return Math.abs(v) < 3 ? Math.round(v * 100) + ' cm' : v.toFixed(2).replace('.', ',') + ' m'; }
function normalizeStatus(raw){
  const s = (raw || '').trim().toLowerCase();
  if (!s) return null;
  if (/execut/.test(s)) return { key: 'executado', label: 'Executado' };
  if (/pendent/.test(s)) return { key: 'pendente', label: 'Pendente' };
  if (/n[aã]o\s*conforme|reprov/.test(s)) return { key: 'nao-conforme', label: 'Não conforme' };
  return { key: 'outro', label: raw.trim() };
}
function pointAnnotation(point){
  let altura = '', comentario = '', status = '';
  point.entries.forEach((e) => {
    const ud = e.mesh.userData || {};
    const params = (ud.parameters && typeof ud.parameters === 'object') ? ud.parameters : ud;
    Object.keys(params).forEach((k) => {
      if (/^type[\s_]/i.test(k)) return;
      const val = params[k];
      if (val === undefined || val === null || val === '') return;
      const key = k.toLowerCase();
      if (!altura && /altura|height|eleva[cç][aã]o/.test(key)) { const n = parseRevitNumber(val); altura = isFinite(n) ? fmtDist(n) : String(val); }
      if (!comentario && /coment|comment/.test(key)) comentario = String(val);
      if (/marca|mark/.test(key)) { const norm = normalizeStatus(String(val)); if (!status && norm && norm.key !== 'outro') status = String(val); }
    });
  });
  return { altura, comentario, status };
}
function renderTomadaProgress(){
  const el = $('tomada-progress');
  const total = tomadaClusters.length;
  if (!total) { el.hidden = true; return; }
  const c = { executado: 0, pendente: 0, nc: 0 };
  tomadaClusters.forEach((t) => {
    const n = normalizeStatus(pointAnnotation(t).status);
    if (!n) return;
    if (n.key === 'executado') c.executado++; else if (n.key === 'pendente') c.pendente++; else if (n.key === 'nao-conforme') c.nc++;
  });
  const pct = Math.round(c.executado / total * 100);
  $('tp-fill').style.width = pct + '%';
  $('tp-text').innerHTML = '<b>' + pct + '%</b> de ' + total + ' tomadas &nbsp;<span class="tp-exec">' + c.executado + ' exec.</span> &nbsp;<span class="tp-pend">' + c.pendente + ' pend.</span>' + (c.nc ? ' &nbsp;<span class="tp-nc">' + c.nc + ' n/c</span>' : '');
  el.title = 'Tomadas deste ' + (current.all ? 'pavimento' : 'ambiente') + ', pelo status da propriedade Marca no Revit.';
  el.hidden = false;
}

/* ---------------- Filtro por categoria ---------------- */
function renderCategoryFilters(){
  const el = $('cat-filters');
  el.innerHTML = '';
  const counts = {};
  meshIndex.forEach((m) => { counts[m.cat] = (counts[m.cat] || 0) + 1; });
  counts.tomada = tomadaClusters.length;
  CATEGORY_ORDER.forEach((cat) => {
    if (!counts[cat]) return;
    const s = CATEGORY_STYLE[cat];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-chip' + (activeCats.has(cat) ? ' active' : '');
    b.innerHTML = '<span class="swatch" style="background:#' + s.color.toString(16).padStart(6, '0') + '"></span>' + s.label + '<span class="n">' + counts[cat] + '</span>';
    b.addEventListener('click', () => {
      activeCats.has(cat) ? activeCats.delete(cat) : activeCats.add(cat);
      renderCategoryFilters(); applyFilters(true);
    });
    el.appendChild(b);
  });
}
function applyFilters(reframe){
  const box = new THREE.Box3();
  meshIndex.forEach((e) => {
    e.mesh.visible = activeCats.size === 0 || activeCats.has(e.cat);
    if (e.mesh.visible) box.expandByObject(e.mesh);
  });
  if (reframe && !box.isEmpty()) frameToSphere(box.getBoundingSphere(new THREE.Sphere()));
}

/* ---------------- Seleção de tomada ---------------- */
function clearSelection(){
  outlines.forEach((o) => { modelGroup.remove(o); o.geometry.dispose(); });
  outlines = [];
  selBar.classList.remove('show');
}
function statusColor(raw){ const n = normalizeStatus(raw); return n && n.key === 'executado' ? 0x2ecc71 : n && n.key === 'nao-conforme' ? 0xff5a5a : 0xffb020; }
function selectMesh(mesh){
  clearSelection();
  const entry = meshIndex.find((m) => m.mesh === mesh);
  const point = entry && entry.cat === 'tomada' ? entry.pointGroup : null;
  const ann = point ? pointAnnotation(point) : null;
  const color = point ? statusColor(ann.status) : 0xffb020;
  (point ? point.entries.map((e) => e.mesh) : [mesh]).forEach((m) => {
    const line = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 20), new THREE.LineBasicMaterial({ color }));
    m.updateWorldMatrix(true, false); line.applyMatrix4(m.matrixWorld);
    modelGroup.add(line); outlines.push(line);
  });
  if (!point) return;
  selMeasures.innerHTML = '';
  const n = normalizeStatus(ann.status);
  const chip = document.createElement('span');
  chip.className = 'status-chip status-' + (n ? n.key : 'none');
  chip.innerHTML = '<span class="sdot"></span>';
  chip.appendChild(document.createTextNode(n ? n.label : 'Sem status'));
  selMeasures.appendChild(chip);
  [['Altura', ann.altura || '—'], ['Comentário', ann.comentario || '—']].forEach(([k, v]) => {
    const s = document.createElement('span'); s.className = 'm'; s.textContent = k + ': ';
    const b = document.createElement('b'); b.textContent = v; s.appendChild(b); selMeasures.appendChild(s);
  });
  selBar.classList.add('show');
}
$('sel-close').addEventListener('click', clearSelection);

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y); downPos = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(allMeshes.filter((m) => m.visible), false);
  if (hits.length) selectMesh(hits[0].object); else clearSelection();
});

/* ---------------- Troca de ambiente ---------------- */
function showRoot(room, root){
  clearSelection();
  modelGroup.clear();
  modelGroup.add(root);
  buildIndex(root);
  activeCats = new Set();
  applyFilters(false);
  new THREE.Box3().setFromObject(modelGroup).getBoundingSphere(fitSphere);
  frameToSphere(fitSphere);
  renderTomadaProgress();
  renderCategoryFilters();
  renderRooms();
  loadingEl.classList.add('hide');
}

function selectRoom(room){
  if (current && current.id === room.id) { frameToSphere(fitSphere); return; }
  current = room;
  titleEl.textContent = room.all ? 'Térreo' : room.label;
  try { history.replaceState(null, '', '#' + room.id); } catch (e) {}
  renderRooms(); renderKeyplan();

  if (cache.has(room.id)) { showRoot(room, cache.get(room.id)); loadTime.textContent = room.label + ' · já carregado'; return; }

  loadingEl.classList.remove('hide');
  loadLabel.textContent = 'Carregando ' + room.label + ' · ' + fmtMB(room.mb);
  errEl.style.display = 'none'; pctEl.textContent = '0%'; barEl.style.width = '0%';
  const t0 = performance.now();
  const requested = room.id;
  loader.load(room.file, (gltf) => {
    const root = gltf.scene || gltf.scenes[0];
    /* Todos os arquivos usam a mesma origem do Revit; centralizamos cada um
       para a câmera orbitar em volta do ambiente. */
    const c = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
    root.position.sub(c);
    cache.set(room.id, root);
    const secs = ((performance.now() - t0) / 1000).toFixed(1).replace('.', ',');
    if (current.id !== requested) { renderRooms(); return; }
    loadTime.textContent = room.label + ' · ' + fmtMB(room.mb) + ' em ' + secs + ' s';
    loadTime.hidden = false;
    showRoot(room, root);
  }, (evt) => {
    if (!evt.total || current.id !== requested) return;
    const p = Math.min(100, Math.round(evt.loaded / evt.total * 100));
    pctEl.textContent = p + '%'; barEl.style.width = p + '%';
  }, (err) => {
    console.error(err);
    loadLabel.textContent = 'Falha ao carregar';
    pctEl.textContent = '';
    errEl.style.display = 'block';
    errEl.textContent = 'Não foi possível abrir ' + room.label + '. Verifique a conexão e toque na aba de novo.';
    current = null; renderRooms();
  });
}

/* ---------------- Barra de ferramentas ---------------- */
$('btn-reset').addEventListener('click', () => { clearSelection(); activeCats.clear(); renderCategoryFilters(); applyFilters(false); frameToSphere(fitSphere); });
$('btn-top').addEventListener('click', () => frameToSphere(fitSphere, true));
$('btn-full').addEventListener('click', () => {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.()?.catch?.(() => {}); else document.exitFullscreen?.(); } catch (e) {}
});
if (window.innerWidth < 400) { $('keyplan').classList.add('min'); $('kp-caret').textContent = '+'; }

/* ---------------- Início ----------------
   Abre direto num ambiente leve (Garagem) para o celular não baixar o térreo
   inteiro logo de cara. #id no link abre outro ambiente. */
const fromHash = ROOMS.find((r) => '#' + r.id === location.hash);
selectRoom(fromHash || ROOMS.find((r) => r.id === 'garagem'));
</script>
